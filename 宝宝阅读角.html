<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>宝宝阅读角</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/reading.css">
  <script src="./js/utils.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #F0F9FF 100%);
      color: #333;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部栏 */
    .topbar {
      background: linear-gradient(135deg, #9B59B6 0%, #8E44AD 100%);
      color: #fff;
      padding: 16px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(142, 68, 173, 0.3);
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topbar-title { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .topbar-title a { color: #fff; text-decoration: none; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
    .topbar-actions .points { background: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 50px; font-weight: 700; }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-title">
        <a href="./index.html">←</a>
        <span>宝宝阅读角</span>
      </div>
      <div class="topbar-actions">
        <span class="points">💎 <span data-points>0</span></span>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab" data-mode="picture" onclick="switchReadingMode('picture')">📚 绘本</button>
      <button class="mode-tab" data-mode="story" onclick="switchReadingMode('story')">🧸 故事</button>
      <button class="mode-tab" data-mode="poem" onclick="switchReadingMode('poem')">🎋 诗词</button>
      <button class="mode-tab" data-mode="english" onclick="switchReadingMode('english')">🌍 英语</button>
    </div>
  </header>

  <main class="container">
    <div id="readingContent"></div>
  </main>

  <script src="./js/reading/data/picture-books.js"></script>
  <script src="./js/reading/data/stories-1.js"></script>
  <script src="./js/reading/data/stories-2.js"></script>
  <script src="./js/reading/data/poems-1.js"></script>
  <script src="./js/reading/data/poems-2.js"></script>
  <script src="./js/reading/data/english-books.js"></script>
  <script src="./js/reading/reader.js"></script>
  <script src="./js/reading/poem-view.js"></script>
  <script src="./js/reading/app.js"></script>
  <script>
    initReadingCorner();
  </script>
</body>
</html>
