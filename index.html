<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>宝宝学习台 · BabyLearning</title>
  <link rel="stylesheet" href="./css/common.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #FFF9E6 0%, #FFE8CC 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 560px; width: 100%;
      background: #fff; border-radius: 28px;
      padding: 36px 24px;
      box-shadow:
        0 18px 50px rgba(255, 140, 66, 0.22),
        0 6px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .logo { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
    h1 {
      font-size: 1.9rem; font-weight: 800; color: #E6731C;
      margin-bottom: 6px; letter-spacing: 1px;
    }
    .sub {
      font-size: 0.95rem; color: #888; margin-bottom: 28px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .subject-card {
      background: #fff;
      border-radius: 20px;
      padding: 22px 12px;
      text-align: center;
      text-decoration: none;
      color: #4A4A4A;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.12),
        0 6px 14px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      border: 2px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .subject-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #FF8C42, #FFB07A);
      opacity: 0.8;
    }
    .subject-card.parent::before {
      background: linear-gradient(90deg, #FF9FB2, #D45D79);
    }
    .subject-card:active {
      transform: scale(0.96);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }
    .subject-card .subject-icon { font-size: 2.8rem; line-height: 1; margin-bottom: 10px; }
    .subject-card h2 { font-size: 1.05rem; color: #E6731C; margin-bottom: 6px; }
    .subject-card p { font-size: 0.74rem; color: #888; line-height: 1.4; }
    .subject-card.reading {
      background: linear-gradient(135deg, #FAF5FF 0%, #F5E8FF 100%);
      border-color: #D7BDE2;
    }
    .subject-card.reading::before { background: linear-gradient(90deg, #9B59B6, #C39BD3); }
    .subject-card.reading h2 { color: #8E44AD; }
    .subject-card.parent {
      background: linear-gradient(135deg, #FFF5FA 0%, #FFE8F0 100%);
      border-color: #FF9FB2;
    }
    .subject-card.parent::before { background: linear-gradient(90deg, #FF9FB2, #D45D79); }
    .subject-card.parent h2 { color: #D45D79; }
    .shop-bar {
      display: block;
      background: linear-gradient(135deg, #FFFBE6 0%, #FFF4CC 100%);
      border: 2px solid #FFD93D;
      border-radius: 20px;
      padding: 16px 20px;
      text-align: center;
      text-decoration: none;
      color: #4A4A4A;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.1),
        0 6px 14px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    .shop-bar:active { transform: scale(0.98); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08); }
    .shop-bar .shop-bar-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .shop-bar .shop-bar-icon { font-size: 1.8rem; }
    .shop-bar .shop-bar-text { text-align: left; }
    .shop-bar h2 { font-size: 1rem; color: #E6A817; margin-bottom: 2px; }
    .shop-bar p { font-size: 0.72rem; color: #888; }
    .parent-bar {
      display: block;
      background: linear-gradient(135deg, #FFF5FA 0%, #FFE8F0 100%);
      border: 2px solid #FF9FB2;
      border-radius: 20px;
      padding: 16px 20px;
      text-align: center;
      text-decoration: none;
      color: #4A4A4A;
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.1),
        0 6px 14px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 24px;
    }
    .parent-bar:active { transform: scale(0.98); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08); }
    .parent-bar .parent-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .parent-bar .parent-icon { font-size: 1.8rem; }
    .parent-bar .parent-text { text-align: left; }
    .parent-bar h2 { font-size: 1rem; color: #D45D79; margin-bottom: 2px; }
    .parent-bar p { font-size: 0.72rem; color: #888; }
    .summary {
      display: flex; justify-content: center; gap: 24px;
      margin-bottom: 22px; font-size: 0.9rem; color: #666;
    }
    .summary span strong { color: #E6731C; font-size: 1.2rem; }
    .tip {
      font-size: 0.78rem; color: #B0A89B;
      line-height: 1.6;
    }
    .tip strong { color: #E6731C; }
    @media (max-width: 480px) {
      html { font-size: 16px; }
      .card { padding: 28px 18px; }
      .features-grid { gap: 12px; }
      .subject-card { padding: 18px 10px; }
      .subject-card .subject-icon { font-size: 2.4rem; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎒</div>
    <h1>宝宝学习台</h1>
    <div class="sub">3–6 岁趣味启蒙小天地</div>

    <div class="summary">
      <span>💎 <strong id="homePoints">0</strong> 积分</span>
      <span>🔥 <strong id="homeStreak">0</strong> 天</span>
    </div>

    <div class="features-grid">
      <a class="subject-card" href="./宝宝识字台.html">
        <div class="subject-icon">📖</div>
        <h2>宝宝识字台</h2>
        <p>分级汉字 · 笔顺动画 · 趣味游戏</p>
      </a>
      <a class="subject-card" href="./宝宝英语台.html">
        <div class="subject-icon">🔤</div>
        <h2>宝宝英语台</h2>
        <p>单词卡片 · 听音选图 · 字母拼图</p>
      </a>
      <a class="subject-card" href="./宝宝数学台.html">
        <div class="subject-icon">🔢</div>
        <h2>宝宝数学台</h2>
        <p>数字认知 · 比大小 · 加减法</p>
      </a>
      <a class="subject-card" href="./宝宝阅读角.html">
        <div class="subject-icon">📚</div>
        <h2>宝宝阅读角</h2>
        <p>绘本故事 · 诗词童谣 · 英语绘本</p>
      </a>
    </div>

    <a class="shop-bar" href="./积分商城.html">
      <div class="shop-bar-row">
        <div class="shop-bar-icon">🎁</div>
        <div class="shop-bar-text">
          <h2>积分商城</h2>
          <p>兑换奖励 · 学习赚积分 · 家长确认</p>
        </div>
      </div>
    </a>

    <a class="parent-bar" href="./家长端.html">
      <div class="parent-row">
        <div class="parent-icon">🔒</div>
        <div class="parent-text">
          <h2>家长端</h2>
          <p>三科统计 · 奖励管理 · 数据备份</p>
        </div>
      </div>
    </a>

    <div class="tip">
      💡 首次打开建议用 <strong>Chrome / Safari</strong><br>
      ⚠️ 学习数据保存在浏览器本地，请及时到家长端备份
    </div>
  </main>

  <script src="./js/utils.js"></script>
  <script>
    const profile = getProfile();
    document.getElementById('homePoints').textContent = profile.points;
    document.getElementById('homeStreak').textContent = profile.streak;
  </script>
</body>
</html>
