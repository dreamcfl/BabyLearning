<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>宝宝识字台</title>
  <link rel="stylesheet" href="./css/common.css">
  <script src="./js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.3.0/dist/hanzi-writer.min.js"></script>
  <style>
    :root {
      --primary: #FF8C42;
      --primary-light: #FFB07A;
      --primary-dark: #E6731C;
      --secondary: #4ECDC4;
      --bg: #FFF9F5;
      --card: #FFFFFF;
      --text: #4A4A4A;
      --text-light: #888888;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== 顶部栏 ========== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(255, 140, 66, 0.25);
    }
    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
    }
    .title { font-size: 1.25rem; font-weight: 800; letter-spacing: 1px; }
    .points {
      background: rgba(255,255,255,0.25);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .points::before { content: '⭐'; }

    /* ========== 模式标签 ========== */
    .mode-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 16px 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mode-tabs::-webkit-scrollbar { display: none; }
    .mode-tab {
      flex: 1;
      min-width: 76px;
      text-align: center;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-light);
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .mode-tab.active {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(255, 140, 66, 0.25);
    }

    /* ========== 主容器 ========== */
    .container { padding: 14px 16px; max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
      min-height: 420px;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title .badge {
      font-size: 0.75rem;
      background: var(--primary-light);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    .empty-tip {
      text-align: center;
      color: var(--text-light);
      padding: 40px 20px;
      font-size: 1rem;
    }

    /* ========== 阶段标签 ========== */
    .stage-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .stage-tabs::-webkit-scrollbar { display: none; }
    .stage-tab {
      flex: 0 0 auto;
      min-width: 90px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: #FFF5EE;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .stage-tab.active {
      background: #fff;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 140, 66, 0.15);
    }
    .stage-tab .st-name { font-weight: 700; font-size: 0.9rem; }
    .stage-tab .st-prog { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }

    /* ========== 字卡网格 ========== */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
    }
    .char-card {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFFFFF 100%);
      border: 2px solid #FFE8D6;
      border-radius: var(--radius);
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .char-card:active { transform: scale(0.96); }
    .char-card.learned { border-color: var(--secondary); background: #F0FFFD; }
    .char-card .learned-mark {
      position: absolute;
      top: 6px; right: 6px;
      width: 20px; height: 20px;
      background: var(--secondary);
      color: #fff;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .char-card.learned .learned-mark { display: flex; }
    .char-card .learned-mark svg { width: 12px; height: 12px; }
    .char-card .ch-emoji { font-size: 1.6rem; margin-bottom: 4px; }
    .char-card .ch-big { font-size: 2rem; font-weight: 800; color: var(--primary-dark); line-height: 1; }
    .char-card .ch-pinyin { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }

    /* ========== 今日任务提示 ========== */
    .today-banner {
      background: linear-gradient(90deg, #FFF5EE, #FFFFFF);
      border: 2px dashed var(--primary-light);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .today-banner.overdue { border-color: var(--red); background: #FFF0F0; }
    .today-banner .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .today-banner .tag-today { background: var(--primary); color: #fff; }
    .today-banner .tag-overdue { background: var(--red); color: #fff; }
    .today-banner .btn-go {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .today-empty {
      text-align: center;
      padding: 18px;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* ========== 练习区 ========== */
    .game-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .game-tabs::-webkit-scrollbar { display: none; }
    .game-tab {
      flex: 1;
      min-width: 90px;
      text-align: center;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      background: #FFF5EE;
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .game-tab.active {
      background: #fff;
      border-color: var(--primary);
      color: var(--primary);
    }
    .game-tab .gt-icon { display: block; font-size: 1.3rem; margin-bottom: 2px; }
    .game-tab .gt-done {
      display: block;
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 2px;
      font-weight: 500;
    }

    .game-stage { text-align: center; }
    .big-speak {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 6px 16px rgba(255, 140, 66, 0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .big-speak:active { transform: scale(0.95); }
    .big-speak.pulsing { animation: pulse 0.9s; }
    .big-speak svg { width: 48px; height: 48px; }
    .replay-tip {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .pic-big { font-size: 4rem; margin-bottom: 6px; }
    .pic-word { font-size: 1.1rem; color: var(--text-light); margin-bottom: 14px; }
    .game-hint { font-size: 1rem; color: var(--text); font-weight: 700; margin-bottom: 16px; }
    .opt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .opt-card {
      background: #FFF8F0;
      border: 2px solid #FFE8D6;
      border-radius: var(--radius);
      padding: 14px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-card:active { transform: scale(0.96); }
    .opt-card .oc-emoji { font-size: 1.6rem; margin-bottom: 4px; }
    .opt-card .oc-char { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); }
    .opt-card .oc-pinyin { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }
    .opt-card.correct { background: #E8FFF5; border-color: var(--green); }
    .opt-card.wrong { background: #FFF0F0; border-color: var(--red); }
    .opt-card.disabled { opacity: 0.7; pointer-events: none; }
    .practice-feedback {
      min-height: 28px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .practice-feedback.show { opacity: 1; }
    .practice-feedback.success { color: var(--green); }
    .practice-feedback.fail { color: var(--red); }
    .practice-next {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    .practice-next.show { display: inline-block; }
    .practice-done { text-align: center; padding: 30px 20px; }
    .practice-done .title-done { font-size: 1.3rem; font-weight: 800; color: var(--green); margin-bottom: 8px; }
    .practice-done .sub-done { color: var(--text-light); }

    /* ========== 翻翻乐 ========== */
    .memory-stat { font-size: 0.95rem; color: var(--text-light); margin-bottom: 12px; }
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 360px;
      margin: 0 auto 16px;
    }
    .mcard {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.35s;
    }
    .mcard.flipped { transform: rotateY(180deg); }
    .mcard.matched { background: var(--green); }
    .mcard.shake { animation: shake 0.4s; }
    .mface {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }
    .mfront { background: #FFF8F0; color: var(--primary-dark); border: 2px solid #FFE8D6; transform: rotateY(180deg); }
    .mfront.is-emoji { font-size: 2rem; }
    .mfront.is-char { font-size: 2.2rem; }
    .mback { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); }

    /* ========== 闯关地图 ========== */
    .level-map {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 10px 0;
    }
    .level-dot {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      background: #E8E8E8;
      color: #999;
    }
    .level-dot.done { background: var(--green); color: #fff; }
    .level-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2); }

    /* ========== 积分商城 ========== */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .shop-item {
      background: #FFF8F0;
      border: 2px solid #FFE8D6;
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      position: relative;
    }
    .shop-icon { width: 44px; height: 44px; margin: 0 auto 8px; }
    .shop-icon svg { width: 100%; height: 100%; }
    .shop-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
    .shop-cost { font-size: 0.85rem; color: var(--primary); font-weight: 800; margin-bottom: 10px; }
    .shop-cost .coin { font-size: 0.7rem; color: var(--text-light); font-weight: 500; }
    .btn-redeem {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 8px 0;
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .btn-redeem:disabled { background: #DDD; color: #999; cursor: not-allowed; }
    .pending-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: var(--yellow);
      color: var(--text);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .exchange-list { margin-top: 20px; }
    .exchange-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #F0F0F0;
    }
    .exchange-item .ex-name { font-weight: 600; font-size: 0.9rem; }
    .exchange-item .ex-date { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
    .exchange-item .ex-status { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
    .exchange-item .ex-status.pending { background: var(--yellow); color: var(--text); }
    .exchange-item .ex-status.confirmed { background: var(--green-light); color: var(--green); }

    /* ========== 字详情弹窗 ========== */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }
    .detail-overlay.show { display: flex; }
    .detail-box {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: modalIn 0.3s;
    }
    .detail-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .detail-head .d-emoji { font-size: 3rem; }
    .detail-head .d-text { flex: 1; }
    .detail-head .d-pinyin { font-size: 1.1rem; color: var(--text-light); }
    .detail-head .d-meaning { font-size: 1.3rem; font-weight: 800; }
    .speak-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-speak {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-speak svg { width: 26px; height: 26px; }
    .btn-speak.speaking { animation: pulse 0.9s infinite; }
    .speak-tip {
      position: absolute;
      top: 56px;
      font-size: 0.65rem;
      color: var(--primary);
      white-space: nowrap;
      font-weight: 700;
    }
    .stroke-wrap {
      background: #FFF8F0;
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }
    #strokeBox {
      width: 240px; height: 240px;
      margin: 0 auto 12px;
      background: #fff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FFE8D6;
    }
    .stroke-fallback {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stroke-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-stroke {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-stroke.ghost { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    .detail-section-title {
      font-weight: 800;
      margin: 16px 0 10px;
      color: var(--text);
    }
    .word-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .word-chip {
      background: #FFF8F0;
      border: 1px solid #FFE8D6;
      border-radius: 18px;
      padding: 8px 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .word-chip svg { width: 16px; height: 16px; color: var(--primary); }
    .picto-box {
      background: #FFF8F0;
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .picto-box svg { width: 100px; height: 100px; margin-bottom: 8px; }
    .picto-box span { display: block; color: var(--text-light); font-size: 0.85rem; }
    .detail-close {
      width: 100%;
      border: none;
      background: var(--green);
      color: #fff;
      padding: 14px;
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 800;
      margin-top: 20px;
      cursor: pointer;
    }

    /* ========== 庆祝弹窗内容 ========== */
    .celebrate-box { text-align: center; padding: 10px; }
    .celebrate-box .stars { font-size: 3rem; margin-bottom: 8px; }
    .celebrate-box h3 { font-size: 1.25rem; margin-bottom: 8px; }
    .points-gain { color: var(--primary); font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; }

    /* ========== 离线提示 ========== */
    .offline-tip {
      display: none;
      background: #FFF8E1;
      color: #B28600;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 14px;
      text-align: center;
    }
    .offline-tip.show { display: block; }

    @media (max-width: 480px) {
      html { font-size: 16px; }
      .char-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="./index.html" class="back-link">← 首页</a>
    <div class="title">宝宝识字台</div>
    <div class="points" id="headerPoints">0</div>
  </div>

  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="today" onclick="switchMode('today')">今日识字</div>
    <div class="mode-tab" data-mode="practice" onclick="switchMode('practice')">趣味练习</div>
    <div class="mode-tab" data-mode="map" onclick="switchMode('map')">闯关地图</div>
    <div class="mode-tab" data-mode="shop" onclick="switchMode('shop')">积分商城</div>
  </div>

  <div class="container">
    <div class="card">
      <div id="gameArea"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box" id="detailBox"></div>
  </div>

<script>
// ============================================================
// 字库数据（保留原版核心数据）
// ============================================================
const RAW_DB = [
  ['一','一','one','数字'], ['二','二','two','数字'], ['三','三','three','数字'], ['四','四','four','数字'], ['五','五','five','数字'], ['六','六','six','数字'], ['七','七','seven','数字'], ['八','八','eight','数字'], ['九','九','nine','数字'], ['十','十','ten','数字'],

function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = speechRate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = speechRate;
  window.speechSynthesis.speak(u);
}

function renderStroke(charId, char) {
  const box = document.getElementById('strokeBox');
  if (!box) return;
  box.innerHTML = '<div class="stroke-fallback">' + char + '</div>';
  if (window.HanziWriter) {
    try {
      box.innerHTML = '';
      HanziWriter.create(box, char, {
        width: 240, height: 240, padding: 5,
        strokeColor: '#FF8C42', radicalColor: '#4ECDC4',
        strokeAnimationSpeed: 1, delayBetweenStrokes: 300,
        showCharacter: false, showOutline: true
      }).animateCharacter();
    } catch (e) { box.innerHTML = '<div class="stroke-fallback">' + char + '</div>'; }
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getStageChars(stage) {
  const s = STAGES[stage - 1];
  if (!s) return [];
  return CHAR_DB.slice(s.idx, s.idx + s.count);
}

function getTodayChars() {
  const daily = getDailyCount();
  const log = getDailyLog();
  const learnedToday = log[today()] || [];
  if (learnedToday.length >= daily) return learnedToday.slice(0, daily).map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean);
  // 优先从当前阶段取未学过的
  let pool = [];
  const current = getStage();
  const stageChars = getStageChars(current);
  const progress = load(ChineseStore.progress, {});
  const unlearnedStage = stageChars.filter(c => !progress[c.id]);
  pool = unlearnedStage.length ? unlearnedStage : stageChars;
  // 如果不够，从下一阶段补
  if (pool.length < daily) {
    const next = getStageChars(current + 1);
    pool = pool.concat(next);
  }
  // 仍不够则全库随机
  if (pool.length < daily) {
    pool = pool.concat(shuffle(CHAR_DB).filter(c => !pool.includes(c)));
  }
  return shuffle(pool).slice(0, daily);
}

function recordLearn(charId) {
  const log = getDailyLog();
  const day = today();
  if (!log[day]) log[day] = [];
  if (!log[day].includes(charId)) log[day].push(charId);
  save(ChineseStore.dailyLog, log);
  const progress = load(ChineseStore.progress, {});
  if (!progress[charId]) {
    progress[charId] = { first: today(), count: 0 };
  }
  progress[charId].count++;
  progress[charId].last = today();
  save(ChineseStore.progress, progress);
  checkStreak();
}

function checkStreak() {
  const s = getStreak();
  const yd = yesterday();
  if (s.lastDate === today()) return;
  if (s.lastDate === yd || s.lastDate === '') {
    s.count = (s.lastDate === yd) ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.lastDate = today();
  ChineseStore.saveStreak(s);
}

function checkDailyComplete() {
  const log = getDailyLog();
  const learnedToday = log[today()] || [];
  return learnedToday.length >= getDailyCount();
}

function ensureDefaultRewards() {
  let rewards = ChineseStore.getRewards();
  if (!rewards.length) {
    rewards = [
      { id: uid(), name: '小贴纸', cost: 20, icon: 'sticker', stock: 999 },
      { id: uid(), name: '看一集动画', cost: 50, icon: 'game', stock: 999 },
      { id: uid(), name: '小零食', cost: 30, icon: 'snack', stock: 999 },
      { id: uid(), name: '新绘本', cost: 100, icon: 'book', stock: 999 }
    ];
    ChineseStore.saveRewards(rewards);
  }
}

// ============================================================
// 模式切换与渲染入口
// ============================================================
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  renderGame();
}

function updateHeader() {
  const el = document.getElementById('headerPoints');
  if (el) el.textContent = ChineseStore.getPoints();
}

function renderGame() {
  updateHeader();
  const area = document.getElementById('gameArea');
  if (!area) return;
  if (currentMode === 'today') renderToday(area);
  else if (currentMode === 'practice') renderPractice(area);
  else if (currentMode === 'map') renderLevelMap(area);
  else if (currentMode === 'shop') renderShop(area);
}

// ============================================================
// 今日识字
// ============================================================
function renderToday(area) {
  const chars = getTodayChars();
  const log = getDailyLog();
  const learnedToday = (log[today()] || []).slice();
  const daily = getDailyCount();
  const complete = checkDailyComplete();

  let html = '<div class="section-title">今日识字<span class="badge">' + learnedToday.length + '/' + daily + '</span></div>';

  if (complete) {
    html += '<div class="today-empty">🎉 今天任务完成啦！去“趣味练习”玩玩吧～</div>';
  } else {
    html += '<div class="today-banner"><div><span class="tag tag-today">今日目标</span>每天认识 ' + daily + ' 个新汉字</div></div>';
  }

  html += '<div class="char-grid">';
  chars.forEach(c => {
    const learned = learnedToday.includes(c.id);
    html += '<div class="char-card ' + (learned ? 'learned' : '') + '" onclick="openCharDetail(\'' + c.id + '\')">' +
      '<div class="learned-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6 10-14"/></svg></div>' +
      '<div class="ch-emoji">' + c.emoji + '</div>' +
      '<div class="ch-big">' + c.char + '</div>' +
      '<div class="ch-pinyin">' + c.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

// ============================================================
// 趣味练习
// ============================================================
function renderPractice(area) {
  const tabs = [
    { key: 'listen', icon: '👂', label: '听音选字' },
    { key: 'pinyin', icon: '🔤', label: '看字选拼音' },
    { key: 'meaning', icon: '🎨', label: '看图选字' },
    { key: 'memory', icon: '🧠', label: '汉字翻翻乐' }
  ];
  let html = '<div class="section-title">趣味练习<span class="badge">快乐巩固</span></div>';
  html += '<div class="game-tabs">';
  tabs.forEach(t => {
    html += '<div class="game-tab ' + (currentPracticeTab === t.key ? 'active' : '') + '" onclick="switchPractice(\'' + t.key + '\')">' +
      '<span class="gt-icon">' + t.icon + '</span>' + t.label + '</div>';
  });
  html += '</div><div id="practiceBox">';

  if (currentPracticeTab === 'memory') {
    html += renderMemoryGameHTML();
  } else {
    html += renderQuizGameHTML(currentPracticeTab);
  }
  html += '</div>';
  area.innerHTML = html;
}

function switchPractice(key) {
  currentPracticeTab = key;
  practiceState = {};
  memoryState = { first: null, matches: 0, total: 0, locked: false, pairs: [] };
  renderGame();
}

function renderQuizGameHTML(type) {
  const learned = Object.keys(load(ChineseStore.progress, {}));
  const pool = learned.length >= 4 ? learned.map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean) : shuffle(CHAR_DB).slice(0, 20);
  if (pool.length < 4) return '<div class="empty-tip">先去“今日识字”学几个字再来挑战吧～</div>';

  const current = pool[Math.floor(Math.random() * pool.length)];
  const question = (function() {
    if (type === 'listen') return { text: '请听读音，选择正确的汉字', speakText: current.char, emoji: '🔊' };
    if (type === 'pinyin') return { text: '这个字的拼音是什么？', speakText: current.char, emoji: current.char };
    if (type === 'meaning') return { text: '哪个字是 ' + current.meaning + ' 的意思？', speakText: '', emoji: current.emoji };
    return { text: '请选择', speakText: '', emoji: '' };
  })();

  const distractors = shuffle(pool.filter(c => c.id !== current.id)).slice(0, 3);
  const options = shuffle([current].concat(distractors));
  practiceState.current = current;
  practiceState.answered = false;

  let html = '<div class="game-stage">';
  html += '<div class="pic-big">' + question.emoji + '</div>';
  if (type === 'listen') {
    html += '<button class="big-speak" onclick="speak(\'' + current.char + '\');this.classList.add(\'pulsing\');setTimeout(()=>this.classList.remove(\'pulsing\'),900)">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>';
    html += '<div class="replay-tip">点喇叭听一听</div>';
  } else if (type === 'pinyin') {
    html += '<div class="pic-word" style="font-size:3rem;font-weight:800;color:var(--primary-dark)">' + current.char + '</div>';
  } else {
    html += '<div class="pic-word">' + current.meaning + '</div>';
  }
  html += '<div class="game-hint">' + question.text + '</div>';
  html += '<div class="opt-grid">';
  options.forEach(opt => {
    html += '<div class="opt-card" id="opt_' + opt.id + '" onclick="pickOption(\'' + opt.id + '\',\'' + current.id + '\',\'' + type + '\')">' +
      '<div class="oc-emoji">' + opt.emoji + '</div>' +
      '<div class="oc-char">' + opt.char + '</div>' +
      '<div class="oc-pinyin">' + opt.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  html += '<div class="practice-feedback" id="practiceFeedback"></div>';
  html += '<button class="practice-next" id="practiceNext" onclick="renderGame()">下一题 →</button>';
  html += '</div>';
  return html;
}

function pickOption(selectedId, correctId, type) {
  if (practiceState.answered) return;
  practiceState.answered = true;
  const correct = selectedId === correctId;
  const current = CHAR_DB.find(c => c.id === correctId);
  const fb = document.getElementById('practiceFeedback');
  const next = document.getElementById('practiceNext');

  document.querySelectorAll('.opt-card').forEach(el => el.classList.add('disabled'));
  const sel = document.getElementById('opt_' + selectedId);
  const cor = document.getElementById('opt_' + correctId);
  if (correct) {
    sel.classList.add('correct');
    fb.textContent = '✅ 答对啦！+' + (type === 'listen' ? 5 : 3) + ' 积分';
    fb.className = 'practice-feedback show success';
    ChineseStore.addPoints(type === 'listen' ? 5 : 3, '趣味练习答对');
    speak('真棒！' + current.char);
  } else {
    sel.classList.add('wrong');
    cor.classList.add('correct');
    fb.textContent = '❌ 不对哦，正确答案是 ' + current.char;
    fb.className = 'practice-feedback show fail';
    speak(current.char);
  }
  if (next) next.classList.add('show');
  updateHeader();
}

function renderMemoryGameHTML() {
  const learned = Object.keys(load(ChineseStore.progress, {}));
  let pool = learned.map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean);
  if (pool.length < 4) pool = shuffle(CHAR_DB).slice(0, 6);
  pool = shuffle(pool).slice(0, 6);
  const pairs = shuffle(pool.flatMap(c => [
    { id: c.id, type: 'char', val: c.char, meta: c },
    { id: c.id, type: 'emoji', val: c.emoji, meta: c }
  ]));
  memoryState.pairs = pairs;
  memoryState.first = null;
  memoryState.matches = 0;
  memoryState.total = pairs.length / 2;
  memoryState.locked = false;

  let html = '<div class="memory-stat">配对 <span id="memMatches">0</span>/' + memoryState.total + '</div>';
  html += '<div class="memory-grid">';
  pairs.forEach((p, i) => {
    html += '<div class="mcard" id="mcard_' + i + '" data-idx="' + i + '" onclick="flipCard(' + i + ')">' +
      '<div class="mface mfront ' + (p.type === 'emoji' ? 'is-emoji' : 'is-char') + '">' + p.val + '</div>' +
      '<div class="mface mback">?</div></div>';
  });
  html += '</div>';
  html += '<div class="practice-feedback" id="memFeedback"></div>';
  return html;
}

function flipCard(idx) {
  if (memoryState.locked) return;
  const el = document.getElementById('mcard_' + idx);
  if (!el || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  const p = memoryState.pairs[idx];
  speak(p.meta.char);

  if (memoryState.first === null) {
    memoryState.first = idx;
    return;
  }

  const firstIdx = memoryState.first;
  const first = memoryState.pairs[firstIdx];
  if (first.id === p.id && firstIdx !== idx) {
    memoryState.locked = true;
    setTimeout(() => {
      document.getElementById('mcard_' + firstIdx).classList.add('matched');
      el.classList.add('matched');
      memoryState.matches++;
      document.getElementById('memMatches').textContent = memoryState.matches;
      memoryState.first = null;
      memoryState.locked = false;
      if (memoryState.matches >= memoryState.total) {
        const fb = document.getElementById('memFeedback');
        fb.textContent = '🎉 全部配对成功！+10 积分';
        fb.className = 'practice-feedback show success';
        ChineseStore.addPoints(10, '翻翻乐完成');
        updateHeader();
      }
    }, 400);
  } else {
    memoryState.locked = true;
    const firstEl = document.getElementById('mcard_' + firstIdx);
    setTimeout(() => {
      el.classList.add('shake');
      firstEl.classList.add('shake');
      setTimeout(() => {
        el.classList.remove('flipped', 'shake');
        firstEl.classList.remove('flipped', 'shake');
        memoryState.first = null;
        memoryState.locked = false;
      }, 400);
    }, 600);
  }
}

// ============================================================
// 闯关地图
// ============================================================
function renderLevelMap(area) {
  const progress = load(ChineseStore.progress, {});
  const totalChars = CHAR_DB.length;
  const levelSize = 5;
  const totalLevels = Math.ceil(totalChars / levelSize);
  const completed = Object.keys(progress).length;
  let currentLevel = Math.floor(completed / levelSize) + 1;
  if (currentLevel > totalLevels) currentLevel = totalLevels;

  let html = '<div class="section-title">闯关地图<span class="badge">已学 ' + completed + '/' + totalChars + '</span></div>';
  html += '<div class="level-map">';
  for (let i = 1; i <= totalLevels; i++) {
    const done = i < currentLevel;
    const cur = i === currentLevel;
    html += '<div class="level-dot ' + (done ? 'done' : '') + ' ' + (cur ? 'current' : '') + '" ' +
      'onclick="startLevel(' + i + ')" title="第 ' + i + ' 关">' + (done ? '✓' : i) + '</div>';
  }
  html += '</div>';
  html += '<div class="empty-tip">点击关卡开始挑战，每关 5 个汉字</div>';
  area.innerHTML = html;
}

function startLevel(level) {
  const levelSize = 5;
  const start = (level - 1) * levelSize;
  const chars = CHAR_DB.slice(start, start + levelSize);
  if (!chars.length) return;
  currentStage = level;
  save(ChineseStore.stage, level);
  // 切换到今日识字并显示该关卡字
  currentMode = 'today';
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === 'today'));
  // 覆盖今日目标为该关卡
  const area = document.getElementById('gameArea');
  let html = '<div class="section-title">第 ' + level + ' 关</div>';
  html += '<div class="char-grid">';
  chars.forEach(c => {
    html += '<div class="char-card" onclick="openCharDetail(\'' + c.id + '\')">' +
      '<div class="ch-emoji">' + c.emoji + '</div>' +
      '<div class="ch-big">' + c.char + '</div>' +
      '<div class="ch-pinyin">' + c.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

// ============================================================
// 积分商城
// ============================================================
function renderShop(area) {
  const rewards = ChineseStore.getRewards();
  const exchanges = ChineseStore.getExchanges();
  const points = ChineseStore.getPoints();

  let html = '<div class="section-title">积分商城<span class="badge">我的积分 ' + points + '</span></div>';
  html += '<div class="shop-grid">';
  rewards.forEach(r => {
    const can = points >= r.cost;
    html += '<div class="shop-item">' +
      '<div class="shop-icon">' + (REWARD_ICONS[r.icon] || REWARD_ICONS.sticker) + '</div>' +
      '<div class="shop-name">' + r.name + '</div>' +
      '<div class="shop-cost">' + r.cost + ' <span class="coin">积分</span></div>' +
      '<button class="btn-redeem" ' + (can ? '' : 'disabled') + ' onclick="redeemReward(\'' + r.id + '\')">' + (can ? '兑换' : '积分不够') + '</button>' +
      '</div>';
  });
  html += '</div>';

  if (exchanges.length) {
    html += '<div class="section-title" style="margin-top:24px">兑换记录</div><div class="exchange-list">';
    exchanges.slice().reverse().forEach(ex => {
      html += '<div class="exchange-item">' +
        '<div><div class="ex-name">' + ex.name + '</div><div class="ex-date">' + ex.date + '</div></div>' +
        '<div class="ex-status pending">待确认</div>' +
        '</div>';
    });
    html += '</div>';
  }
  area.innerHTML = html;
}

function redeemReward(rid) {
  const rewards = ChineseStore.getRewards();
  const r = rewards.find(x => x.id === rid);
  if (!r) return;
  if (ChineseStore.getPoints() < r.cost) return;
  ChineseStore.addPoints(-r.cost, '兑换 ' + r.name);
  const exchanges = ChineseStore.getExchanges();
  exchanges.push({ id: uid(), rewardId: rid, name: r.name, cost: r.cost, date: today(), status: 'pending' });
  ChineseStore.saveExchanges(exchanges);
  updateHeader();
  showModal('🎉 兑换成功', '你兑换了“' + r.name + '”，请在家长端确认领取！', [{ text: '好的', action: renderGame }]);
}

// ============================================================
// 字详情弹窗
// ============================================================
function openCharDetail(charId) {
  const c = CHAR_DB.find(x => x.id === charId);
  if (!c) return;
  recordLearn(charId);

  const box = document.getElementById('detailBox');
  let html = '<div class="detail-head">' +
    '<div class="d-emoji">' + c.emoji + '</div>' +
    '<div class="d-text"><div class="d-pinyin">' + c.pinyin + '</div><div class="d-meaning">' + c.char + ' · ' + c.meaning + '</div></div>' +
    '<div class="speak-wrap"><button class="btn-speak" id="detailSpeak" onclick="speak(\'' + c.char + '\');document.getElementById(\'detailSpeak\').classList.add(\'speaking\');setTimeout(()=>document.getElementById(\'detailSpeak\').classList.remove(\'speaking\'),900)">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>' +
    '<span class="speak-tip">点我读一读</span></div></div>';

  html += '<div class="stroke-wrap"><div class="detail-section-title">笔画笔顺</div><div id="strokeBox"></div>' +
    '<div class="stroke-actions"><button class="btn-stroke" onclick="renderStroke(\'' + c.id + '\',\'' + c.char + '\')">再写一遍</button>' +
    '<button class="btn-stroke ghost" onclick="speak(\'' + c.word + '\')">读词语</button></div></div>';

  html += '<div class="detail-section-title">例词</div><div class="word-chips">' +
    '<div class="word-chip" onclick="speak(\'' + c.word + '\')">' + c.word + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg></div>' +
    '</div>';

  html += '<button class="detail-close" onclick="closeDetail()">学会了 ✓</button>';
  box.innerHTML = html;
  document.getElementById('detailOverlay').classList.add('show');
  setTimeout(() => renderStroke(c.id, c.char), 100);
  speak(c.char);
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  renderGame();
}

// ============================================================
// 弹窗
// ============================================================
function showModal(title, content, buttons) {
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  buttons = buttons || [{ text: '确定', action: closeModal }];
  let html = '<h3>' + title + '</h3><p>' + content + '</p><div class="modal-actions">';
  buttons.forEach((b, i) => {
    html += '<button class="modal-btn ' + (i === 0 ? 'primary' : '') + '" onclick="modalAction(' + i + ')">' + b.text + '</button>';
  });
  html += '</div>';
  box.innerHTML = html;
  box.dataset.actions = JSON.stringify(buttons.map(b => b.action ? b.action.toString() : ''));
  overlay.classList.add('show');
}

function modalAction(i) {
  closeModal();
  // 简单支持：如果按钮有 action 字符串，重新触发 renderGame
  renderGame();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ============================================================
// 初始化
// ============================================================
function init() {
  voiceOn = ChineseStore.getVoiceEnabled();
  speechRate = ChineseStore.getRate() || 0.7;
  currentStage = getStage();
  ensureDefaultRewards();
  updateHeader();
  renderGame();

  // 详情弹窗点击遮罩关闭
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target.id === 'detailOverlay') closeDetail();
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
}

window.addEventListener('load', init);
