<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>宝宝识字台</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.0/dist/hanzi-writer.min.js"></script>
<style>
/* ========== 基础重置 ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 18px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #FFF9E6 0%, #FFF0E0 100%);
  color: #333;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-font-smoothing: antialiased;
}

/* ========== CSS 变量 ========== */
:root {
  --orange: #FF8C42;
  --orange-light: #FFB07A;
  --orange-dark: #E6731C;
  --teal: #4ECDC4;
  --teal-light: #7FE0D8;
  --teal-dark: #3AAFA6;
  --yellow: #FFD93D;
  --green: #6BCB77;
  --green-light: #95DCA0;
  --red: #FF6B6B;
  --red-light: #FF9999;
  --purple: #B19CD9;
  --pink: #FF9FB2;
  --text: #4A4A4A;
  --text-light: #888;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;
}

/* ========== 顶部栏 ========== */
.topbar {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
  color: #fff;
  padding: 16px 20px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(230,115,28,0.3);
}
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.topbar-title svg { width: 32px; height: 32px; flex-shrink: 0; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.mode-tabs { display: flex; background: rgba(255,255,255,0.25); border-radius: 50px; padding: 3px; margin-top: 12px; }
.mode-tab {
  flex: 1; text-align: center; padding: 8px 0; font-size: 1rem; font-weight: 700;
  color: rgba(255,255,255,0.8); border-radius: 50px; cursor: pointer; transition: all 0.3s;
  border: none; background: transparent; min-height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.mode-tab.active { background: #fff; color: var(--orange-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.mode-tab svg { width: 20px; height: 20px; }

.btn-icon {
  background: rgba(255,255,255,0.2); border: none; color: #fff; width: 40px; height: 40px;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.btn-icon:hover { background: rgba(255,255,255,0.35); }
.btn-icon svg { width: 20px; height: 20px; }
.btn-icon.off { opacity: 0.45; }

/* ========== 主容器 ========== */
.container { max-width: 720px; margin: 0 auto; padding: 16px; }

/* ========== 备份提示条 ========== */
.backup-notice {
  background: linear-gradient(90deg, #FFF3CD, #FFE8A3); border: 1px solid var(--yellow);
  border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.85rem; color: #856404;
  margin-bottom: 12px; display: none; align-items: center; gap: 8px; line-height: 1.4;
}
.backup-notice.show { display: flex; }
.backup-notice svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ========== 离线提示 ========== */
.offline-tip {
  background: #FFE8E8; border: 1px solid var(--red-light); border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 0.82rem; color: #721C24; margin-bottom: 12px;
  display: none; align-items: center; gap: 8px;
}
.offline-tip.show { display: flex; }

/* ========== 今天要处理 ========== */
.today-box {
  background: linear-gradient(135deg, #FFF5F5 0%, #FFE8E8 100%);
  border: 2px solid var(--red-light); border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
}
.today-box-title {
  font-size: 1.15rem; font-weight: 800; color: var(--red);
  display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
}
.today-box-title svg { width: 22px; height: 22px; }
.today-item {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
  background: #fff; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 1rem; gap: 8px;
}
.today-item:last-child { margin-bottom: 0; }
.today-item.overdue { border-left: 4px solid var(--red); }
.today-item.today { border-left: 4px solid var(--orange); }
.today-item-text { flex: 1; line-height: 1.4; }
.today-item-text .tag-overdue, .today-item-text .tag-today {
  display: inline-block; color: #fff; font-size: 0.7rem; padding: 2px 6px;
  border-radius: 4px; margin-right: 6px; font-weight: 700;
}
.today-item-text .tag-overdue { background: var(--red); }
.today-item-text .tag-today { background: var(--orange); }
.today-empty { text-align: center; color: var(--green); font-weight: 700; padding: 12px 0; font-size: 1.05rem; }
.btn-go {
  background: var(--orange); color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer; white-space: nowrap; min-height: 44px; transition: all 0.2s;
}
.btn-go:hover { background: var(--orange-dark); }

/* ========== 卡片通用 ========== */
.card { background: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-title {
  font-size: 1.25rem; font-weight: 800; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-title svg { width: 26px; height: 26px; }
.card-title .count-badge {
  margin-left: auto; background: var(--orange-light); color: #fff; font-size: 0.8rem;
  padding: 3px 10px; border-radius: 50px; font-weight: 700;
}

/* ========== 积分概览 ========== */
.points-overview { display: flex; gap: 12px; margin-bottom: 16px; }
.points-box { flex: 1; background: #fff; border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: var(--shadow); }
.points-box .num { font-size: 2rem; font-weight: 900; color: var(--orange); line-height: 1.2; }
.points-box .num.green { color: var(--green); }
.points-box .label { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }

/* ========== 阶段选择 ========== */
.stage-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.stage-tab {
  flex: 1; min-width: 92px; background: #FFF5E6; border: 2px solid var(--orange-light);
  border-radius: var(--radius-sm); padding: 10px 6px; cursor: pointer; text-align: center;
  transition: all 0.2s; border-bottom-width: 4px;
}
.stage-tab.active { background: var(--orange); border-color: var(--orange-dark); color: #fff; }
.stage-tab .st-name { font-size: 0.95rem; font-weight: 800; line-height: 1.3; }
.stage-tab .st-prog { font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }

/* ========== 字卡网格（4-6岁：大字号 + 图） ========== */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; }
.char-card {
  background: linear-gradient(135deg, #FFFDF7 0%, #FFF6E8 100%);
  border: 3px solid var(--orange-light); border-radius: var(--radius);
  aspect-ratio: 1; cursor: pointer; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.char-card:active { transform: scale(0.94); }
.char-card.learned { border-color: var(--green); background: linear-gradient(135deg, #F3FFF3 0%, #E6F9E6 100%); }
.char-card .ch-emoji { font-size: 1.5rem; line-height: 1; }
.char-card .ch-big { font-size: 2.6rem; font-weight: 900; color: var(--orange-dark); line-height: 1.05; }
.char-card .ch-pinyin { font-size: 0.78rem; color: var(--teal-dark); font-weight: 700; }
.char-card .learned-mark {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: var(--green);
  border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 2;
}
.char-card.learned .learned-mark { display: flex; }
.char-card .learned-mark svg { width: 12px; height: 12px; color: #fff; }
.char-progress { margin-top: 14px; text-align: center; font-size: 0.95rem; color: var(--text-light); }
.char-progress .done { color: var(--green); font-weight: 700; }

/* ========== 字详情弹窗 ========== */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.detail-overlay.show { display: flex; }
.detail-box {
  background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 460px;
  max-height: 92vh; overflow-y: auto; padding: 20px; animation: modalIn 0.25s;
}
@keyframes modalIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
.detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.detail-head .d-emoji { font-size: 2.6rem; line-height: 1; }
.detail-head .d-text { flex: 1; }
.detail-head .d-pinyin { font-size: 1.05rem; color: var(--teal-dark); font-weight: 700; }
.detail-head .d-meaning { font-size: 0.9rem; color: var(--text-light); }
.btn-speak {
  background: var(--teal); color: #fff; border: none; width: 56px; height: 56px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.2s;
}
.btn-speak:hover { background: var(--teal-dark); }
.btn-speak.speaking { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,0.6)} 50%{box-shadow:0 0 0 12px rgba(78,205,196,0)} }
.btn-speak svg { width: 28px; height: 28px; }

/* 田字格 + 笔顺 */
.stroke-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: #FFFDF5; border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
}
#strokeBox { width: 240px; height: 240px; }
#strokeBox svg { width: 100%; height: 100%; }
.stroke-fallback {
  font-size: 7rem; font-weight: 900; color: var(--orange-dark);
  display: flex; align-items: center; justify-content: center;
  width: 240px; height: 240px;
  background:
    linear-gradient(to right, transparent 49.6%, #FFD9B3 49.6%, #FFD9B3 50.4%, transparent 50.4%),
    linear-gradient(to bottom, transparent 49.6%, #FFD9B3 49.6%, #FFD9B3 50.4%, transparent 50.4%);
  border: 3px solid var(--orange); border-radius: 8px; line-height: 1;
}
.stroke-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn-stroke {
  background: var(--orange); color: #fff; border: none; padding: 9px 16px; border-radius: 50px;
  font-size: 0.88rem; font-weight: 700; cursor: pointer; min-height: 42px; transition: all 0.2s;
}
.btn-stroke:hover { background: var(--orange-dark); }
.btn-stroke.ghost { background: #fff; color: var(--orange); border: 2px solid var(--orange-light); }

/* 组词 */
.word-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.word-chip {
  background: #F0FFF8; border: 2px solid var(--teal-light); border-radius: 50px;
  padding: 8px 14px; font-size: 1rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: 5px; min-height: 40px; transition: all 0.2s;
}
.word-chip:active { transform: scale(0.95); }
.word-chip svg { width: 15px; height: 15px; color: var(--teal-dark); }
.detail-section-title {
  font-size: 0.95rem; font-weight: 800; color: var(--text); margin: 14px 0 8px;
  display: flex; align-items: center; gap: 6px;
}
/* 象形演变图 */
.picto-box {
  display: flex; align-items: center; gap: 12px; background: #FFF9F0;
  border: 2px dashed var(--orange-light); border-radius: var(--radius); padding: 12px;
}
.picto-box svg { width: 72px; height: 72px; flex-shrink: 0; }
.picto-box span { font-size: 0.85rem; color: var(--text-light); line-height: 1.5; }

.detail-close {
  width: 100%; background: var(--green); color: #fff; border: none; padding: 14px;
  border-radius: 50px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  margin-top: 16px; min-height: 50px;
}
.detail-close:hover { filter: brightness(0.95); }

/* ========== 趣味练习 ========== */
.practice-area { text-align: center; }

/* 游戏切换 */
.game-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.game-tab {
  flex: 1; background: #F5F5F5; border: 2px solid transparent; border-radius: 50px;
  padding: 8px 4px; font-size: 0.82rem; font-weight: 700; cursor: pointer; color: var(--text-light);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 52px; justify-content: center; transition: all 0.2s;
}
.game-tab .gt-icon { font-size: 1.15rem; line-height: 1; }
.game-tab.active { background: var(--teal); border-color: var(--teal-dark); color: #fff; }
.game-tab .gt-done { font-size: 0.62rem; opacity: 0.9; }

/* 游戏舞台 */
.game-stage { padding: 4px 0; }
.game-hint { font-size: 1rem; color: var(--text-light); margin-bottom: 14px; font-weight: 600; }

/* 大播放按钮（听音选字） */
.big-speak {
  width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  color: #fff; display: flex; align-items: center; justify-content: center;
  margin: 6px auto 14px; box-shadow: 0 6px 18px rgba(78,205,196,0.4); transition: transform 0.15s;
}
.big-speak:active { transform: scale(0.92); }
.big-speak svg { width: 44px; height: 44px; }
.big-speak.pulsing { animation: pulse 1s infinite; }
.replay-tip { font-size: 0.8rem; color: var(--text-light); margin-top: -6px; margin-bottom: 12px; }

/* 大图提示（看图选字） */
.pic-big {
  font-size: 5rem; line-height: 1; margin: 6px auto 8px;
  width: 130px; height: 130px; display: flex; align-items: center; justify-content: center;
  background: #FFF9F0; border: 3px dashed var(--orange-light); border-radius: var(--radius);
}
.pic-word { font-size: 0.95rem; color: var(--text-light); margin-bottom: 12px; font-weight: 600; }

/* 选项卡片（4 选 1） */
.opt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 340px; margin: 0 auto; }
.opt-card {
  background: linear-gradient(135deg, #FFFDF7 0%, #FFF6E8 100%);
  border: 3px solid var(--orange-light); border-radius: var(--radius);
  aspect-ratio: 1; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; transition: transform 0.15s;
}
.opt-card:active { transform: scale(0.94); }
.opt-card .oc-emoji { font-size: 1.3rem; line-height: 1; }
.opt-card .oc-char { font-size: 2.4rem; font-weight: 900; color: var(--orange-dark); line-height: 1.05; }
.opt-card .oc-pinyin { font-size: 0.72rem; color: var(--teal-dark); font-weight: 700; }
.opt-card.correct {
  border-color: var(--green); background: linear-gradient(135deg,#D4EDDA,#C3E6CB);
  animation: bounce 0.4s;
}
.opt-card.correct .oc-char { color: var(--green); }
.opt-card.wrong {
  border-color: var(--red); background: linear-gradient(135deg,#FFE0E0,#FFCACA);
  animation: shake 0.4s;
}
.opt-card.wrong .oc-char { color: var(--red); }
.opt-card.disabled { pointer-events: none; opacity: 0.55; }
.opt-card.hint-on { border-color: var(--teal); background: #F0FFF8; }

/* 记忆翻牌 */
.memory-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  max-width: 360px; margin: 0 auto;
}
.mcard {
  aspect-ratio: 1; border-radius: var(--radius-sm); cursor: pointer;
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
  display: flex; align-items: center; justify-content: center; position: relative;
  transition: transform 0.2s;
}
.mcard:active { transform: scale(0.94); }
.mcard .mface {
  font-size: 1.6rem; color: #fff; font-weight: 900; line-height: 1;
  display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
}
.mcard .mback { display: block; font-size: 1.5rem; }
.mcard .mfront { display: none; }
.mcard.flipped { background: #fff; border: 3px solid var(--orange-light); }
.mcard.flipped .mback { display: none; }
.mcard.flipped .mfront { display: flex; font-size: 1.9rem; }
.mcard.flipped .mfront.is-emoji { font-size: 1.7rem; }
.mcard.flipped .mfront.is-char {
  font-weight: 900; color: var(--orange-dark); font-size: 1.9rem;
}
.mcard.matched { background: #E6F9E6; border: 3px solid var(--green); pointer-events: none; opacity: 0.75; }
.mcard.matched .mfront { display: flex; }
.mcard.matched .mback { display: none; }
.mcard.shake { animation: shake 0.4s; }
.memory-stat {
  font-size: 0.9rem; color: var(--text-light); margin-bottom: 10px; font-weight: 600;
}
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.practice-feedback { margin-top: 14px; padding: 12px; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; display: none; }
.practice-feedback.show { display: block; }
.practice-feedback.success { background: #D4EDDA; color: #155724; }
.practice-feedback.fail { background: #FFE0E0; color: #721C24; }
.practice-next {
  background: var(--teal); color: #fff; border: none; padding: 14px 32px; border-radius: 50px;
  font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 12px; min-height: 50px; display: none;
}
.practice-next.show { display: inline-block; }
.practice-done { text-align: center; padding: 20px; }
.practice-done .title-done { font-size: 1.3rem; font-weight: 800; color: var(--green); margin-bottom: 4px; }
.practice-done .sub-done { font-size: 0.95rem; color: var(--text-light); }

/* ========== 闯关进度 ========== */
.level-map { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.level-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0;
}
.level-dot.done { background: var(--green); color: #fff; }
.level-dot.current { background: var(--orange); color: #fff; box-shadow: 0 0 0 4px var(--orange-light); animation: pulse2 1.5s infinite; }
.level-dot.locked { background: #E0E0E0; color: #AAA; }
@keyframes pulse2 { 0%,100%{box-shadow:0 0 0 4px var(--orange-light)} 50%{box-shadow:0 0 0 8px rgba(255,176,122,0.3)} }
.streak-box {
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 1.05rem;
  font-weight: 700; color: var(--orange); padding: 10px; background: #FFF5E6; border-radius: var(--radius-sm);
}
.streak-box svg { width: 22px; height: 22px; }

/* ========== 积分商城 ========== */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.shop-item {
  background: linear-gradient(135deg, #FFF5FA 0%, #FFE8F0 100%); border: 2px solid var(--pink);
  border-radius: var(--radius); padding: 14px 10px; text-align: center; position: relative;
}
.shop-item .shop-icon {
  width: 56px; height: 56px; margin: 0 auto 8px; background: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.shop-item .shop-icon svg { width: 36px; height: 36px; }
.shop-item .shop-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.shop-item .shop-cost { font-size: 1.1rem; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.shop-item .shop-cost .coin { font-size: 0.85rem; }
.btn-redeem {
  background: var(--orange); color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer; width: 100%; min-height: 44px;
}
.btn-redeem:disabled { background: #CCC; cursor: not-allowed; }
.shop-item .pending-badge {
  position: absolute; top: 6px; right: 6px; background: var(--yellow); color: #856404;
  font-size: 0.7rem; padding: 2px 8px; border-radius: 50px; font-weight: 700;
}
.exchange-list { margin-top: 16px; }
.exchange-item {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
  background: #FFF9F0; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 0.95rem; gap: 8px;
}
.exchange-item .ex-name { font-weight: 600; }
.exchange-item .ex-date { font-size: 0.8rem; color: var(--text-light); }
.exchange-item .ex-status { font-size: 0.8rem; padding: 3px 10px; border-radius: 50px; font-weight: 700; white-space: nowrap; }
.ex-status.pending { background: var(--yellow); color: #856404; }
.ex-status.confirmed { background: var(--green); color: #fff; }

/* ========== 家长模式 ========== */
.parent-locked { text-align: center; padding: 40px 20px; }
.parent-locked svg { width: 56px; height: 56px; color: var(--orange); margin-bottom: 12px; }
.parent-locked h3 { font-size: 1.3rem; margin-bottom: 6px; }
.parent-locked p { color: var(--text-light); font-size: 0.95rem; margin-bottom: 20px; }
.pin-input-area { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
.pin-input {
  width: 56px; height: 64px; text-align: center; font-size: 1.8rem; font-weight: 800;
  border: 3px solid var(--orange-light); border-radius: var(--radius-sm); background: #fff;
  color: var(--orange-dark); outline: none;
}
.pin-input:focus { border-color: var(--orange); }
.btn-pin {
  background: var(--orange); color: #fff; border: none; padding: 14px 32px; border-radius: 50px;
  font-size: 1.1rem; font-weight: 700; cursor: pointer; min-height: 50px;
}
.pin-error { color: var(--red); font-size: 0.95rem; margin-top: 8px; display: none; }
.pin-error.show { display: block; }
.parent-panel { display: none; }
.parent-panel.show { display: block; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: #fff; border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: var(--shadow); }
.stat-card .stat-num { font-size: 1.8rem; font-weight: 900; color: var(--orange); line-height: 1.2; }
.stat-card .stat-label { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }

.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEE; gap: 12px; }
.setting-row:last-child { border-bottom: none; }
.setting-row .setting-label { font-size: 1rem; font-weight: 600; flex-shrink: 0; }
.setting-row .setting-control { display: flex; align-items: center; gap: 8px; }
.setting-row input[type="number"] { width: 70px; padding: 8px; font-size: 1.1rem; text-align: center; border: 2px solid var(--orange-light); border-radius: 8px; outline: none; }
.setting-row input[type="text"] { width: 120px; padding: 8px 10px; font-size: 1rem; border: 2px solid var(--orange-light); border-radius: 8px; outline: none; }
.setting-row select { padding: 8px; font-size: 1rem; border: 2px solid var(--orange-light); border-radius: 8px; outline: none; background: #fff; }

.reward-manage-item {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
  background: #FFF9F0; border-radius: var(--radius-sm); margin-bottom: 8px; gap: 8px; font-size: 0.95rem;
}
.btn-small { padding: 6px 12px; font-size: 0.85rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; min-height: 36px; }
.btn-confirm { background: var(--green); color: #fff; }
.btn-delete { background: var(--red-light); color: #fff; }
.btn-add {
  background: var(--teal); color: #fff; border: none; padding: 12px 20px; border-radius: 8px;
  font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; min-height: 50px;
}
.btn-danger {
  background: #fff; color: var(--red); border: 2px solid var(--red-light); padding: 12px 20px;
  border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; min-height: 50px; margin-top: 12px;
}

/* ========== 通用弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center;
  justify-content: center; z-index: 400; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: var(--radius-lg); padding: 24px 20px; max-width: 400px; width: 100%; text-align: center; animation: modalIn 0.3s; }
.modal-box h3 { font-size: 1.3rem; margin-bottom: 8px; }
.modal-box p { color: var(--text-light); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; }
.modal-buttons { display: flex; gap: 10px; }
.modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; min-height: 50px; }
.btn-modal-cancel { background: #E0E0E0; color: #555; }
.btn-modal-confirm { background: var(--red); color: #fff; }
.btn-modal-ok { background: var(--green); color: #fff; width: 100%; }
.celebrate-box .stars { font-size: 3rem; margin-bottom: 8px; }
.celebrate-box h3 { font-size: 1.5rem; color: var(--orange); margin-bottom: 8px; }
.celebrate-box .points-gain { font-size: 1.2rem; color: var(--green); font-weight: 800; margin-bottom: 16px; }

.hidden { display: none !important; }
@media (max-width: 480px) {
  html { font-size: 16px; }
  .container { padding: 12px; }
  .char-grid { grid-template-columns: repeat(3, 1fr); }
  .opt-grid { gap: 10px; }
  .opt-card .oc-char { font-size: 2.1rem; }
  .big-speak { width: 84px; height: 84px; }
  .big-speak svg { width: 38px; height: 38px; }
  .pic-big { width: 110px; height: 110px; font-size: 4.2rem; }
  .mcard .mfront { font-size: 1.6rem; }
  .mcard .mfront.is-char { font-size: 1.6rem; }
  .game-tab { font-size: 0.74rem; min-height: 48px; }
  .game-tab .gt-icon { font-size: 1.05rem; }
  .pin-input { width: 48px; height: 56px; font-size: 1.5rem; }
  #strokeBox, .stroke-fallback { width: 200px; height: 200px; }
  .stroke-fallback { font-size: 5.5rem; }
}
.bottom-spacer { height: 20px; }
</style>
</head>
<body>

<!-- ========== 顶部栏 ========== -->

// 解析为 { char, pinyin, emoji, words, stage }
const CHAR_DB = [];
Object.keys(RAW_DB).sort((a,b)=>a-b).forEach(stage => {
  RAW_DB[stage].chars.forEach((raw, i) => {
    const [char, pinyin, emoji, wordsStr] = raw.split('|');
    CHAR_DB.push({
      char, pinyin, emoji,
      words: (wordsStr||'').split(',').filter(Boolean),
      stage: Number(stage),
      idx: CHAR_DB.length,
      meaning: RAW_DB[stage].name
    });
  });
});

// 按阶段取字
function getStageChars(stage) { return CHAR_DB.filter(c => c.stage === Number(stage)); }

// ============================================================
// 语音朗读（Web Speech API，零依赖）
// ============================================================
let zhVoice = null;
let voiceOn = true;
let speechRate = 0.75;

function initVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN|zh[-_]Hans|Chinese/i.test(v.lang + ' ' + v.name)) || null;
}
if (window.speechSynthesis) {
  initVoice();
  speechSynthesis.onvoiceschanged = initVoice;
}

function speak(text, rate) {
  if (!voiceOn) return;
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = rate || speechRate;   // 4-6 岁用慢速，听得清
    u.pitch = 1.15;                 // 略高音调，更亲切
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u);
  } catch(e) { /* 静默失败，不影响学习 */ }
}

// 带按钮动画的朗读
function speakWithFeedback(btn, text) {
  speak(text);
  if (!btn) return;
  btn.classList.add('speaking');
  const ms = Math.max(900, text.length * 420);
  setTimeout(() => btn.classList.remove('speaking'), ms);
}

// ============================================================
// 笔顺动画（Hanzi Writer + CDN 字库，失败时降级为田字格大字）
// ============================================================
let currentWriter = null;
let offlineWarned = false;

function loadCharData(char, onComplete) {
  const url = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(char)}.json`;
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('404'); return r.json(); })
    .then(onComplete)
    .catch(() => { onComplete(null); });
}

function renderStrokeBox(char) {
  const box = document.getElementById('strokeBox');
  currentWriter = null;
  // 先显示占位，避免加载期间空白
  box.innerHTML = '<div class="stroke-fallback" style="color:#DDD;">⋯</div>';

  // 没有库或网络不通时直接降级为静态田字格大字
  if (!window.HanziWriter) { showStrokeFallback(box, char); return; }

  loadCharData(char, (data) => {
    if (!data) { showStrokeFallback(box, char); return; }
    box.innerHTML = '';
    currentWriter = HanziWriter.create(box, char, {
      width: 240, height: 240, padding: 12,
      showOutline: true,
      strokeAnimationSpeed: 0.55,
      delayBetweenStrokes: 350,
      strokeColor: '#FF8C42',
      outlineColor: '#E8E0D0',
      radicalColor: '#4ECDC4',
      // 数据已预取，直接同步返回，避免二次请求
      charDataLoader: (c, onComplete) => onComplete(data)
    });
  });
}

function showStrokeFallback(box, char) {
  box.innerHTML = `<div class="stroke-fallback">${char}</div>`;
  if (!offlineWarned) {
    offlineWarned = true;
    document.getElementById('offlineTip').classList.add('show');
  }
}

function animateStroke() {
  if (currentWriter && currentWriter.animateCharacter) {
    currentWriter.animateCharacter();
  } else {
    const c = document.querySelector('.stroke-fallback');
    if (c) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = 'bounce 0.5s'; }
  }
}

function startQuiz() {
  if (!currentWriter || !currentWriter.quiz) {
    showModal('ok', '笔顺数据没能加载出来，暂时不能描红哦~ 请检查网络后重试。', null);
    return;
  }
  currentWriter.quiz({
    onComplete: () => {
      addPoints(2, '描红完成');
      renderPointsOverview();
      showModal('ok', '描红完成！太棒了！+2分', null);
    }
  });
}

const PREFIX = 'wb_babychar_';
const K = {
  daily: PREFIX + 'dailyCount',
  pin: PREFIX + 'pin',
  progress: PREFIX + 'progress',
  dailyLog: PREFIX + 'dailyLog',
  points: PREFIX + 'points',
  pointsHistory: PREFIX + 'pointsHistory',
  rewards: PREFIX + 'rewards',
  exchanges: PREFIX + 'exchanges',
  streak: PREFIX + 'streak',
  charCursor: PREFIX + 'charCursor',
  mode: PREFIX + 'mode',
  stage: PREFIX + 'stage',
  voice: PREFIX + 'voice',
  rate: PREFIX + 'rate',
};

function today() { return new Date().toISOString().slice(0,10); }
function yesterday() { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function getDailyCount() { return load(K.daily, 5); }
function getCharCursor() { return load(K.charCursor, 0); }
function getDailyLog() { return load(K.dailyLog, {}); }
function getPoints() { return load(K.points, 0); }
function getPointsHistory() { return load(K.pointsHistory, []); }
function getRewards() { return load(K.rewards, []); }
function getExchanges() { return load(K.exchanges, []); }
function getStreak() { return load(K.streak, {count:0, lastDate:''}); }
function getPin() { return load(K.pin, null); }
function getStage() { return load(K.stage, 1); }

function addPoints(amount, desc) {
  save(K.points, getPoints() + amount);
  const hist = getPointsHistory();
  hist.push({type: amount > 0 ? 'earn' : 'spend', amount: Math.abs(amount), date: today(), desc});
  save(K.pointsHistory, hist);
}

// ============================================================
// 今日学习队列（在当前阶段内推进）
// ============================================================
function getStageCursor() {
  // cursor 按阶段分别存，切阶段互不影响
  return load(K.charCursor + '_s' + getStage(), 0);
}
function setStageCursor(v) { save(K.charCursor + '_s' + getStage(), v); }

function getTodayChars() {
  const stageChars = getStageChars(getStage());
  const cursor = getStageCursor();
  const count = getDailyCount();
  const chars = [];
  for (let i = 0; i < count; i++) {
    const idx = (cursor + i) % stageChars.length;
    chars.push(stageChars[idx]);
  }
  return chars;
}

function getTodayLog() {
  const log = getDailyLog();
  const t = today();
  const cur = getStage();
  if (!log[t]) {
    log[t] = {
      stage: cur,
      chars: getTodayChars().map(c => c.idx),
      learned: [], practiced: [], done: false
    };
    save(K.dailyLog, log);
  } else if (log[t].stage !== cur && !log[t].done) {
    // 切换了学习阶段且今天尚未完成：按新阶段重排今日任务
    log[t].stage = cur;
    log[t].chars = getTodayChars().map(c => c.idx);
    log[t].learned = [];
    log[t].practiced = [];
    save(K.dailyLog, log);
  }
  return log[t];
}

// ============================================================
// 渲染：今天要处理
// ============================================================
function renderTodayBox() {
  const list = document.getElementById('todayList');
  const tLog = getTodayLog();
  const log = getDailyLog();
  const yLog = log[yesterday()];

  let html = '';
  if (yLog && !yLog.done) {
    const yChars = (yLog.chars||[]).map(idx => (CHAR_DB[idx]||{}).char || '?').join('、');
    html += `<div class="today-item overdue">
      <div class="today-item-text"><span class="tag-overdue">逾期</span>昨天的字还没学完：${yChars}</div>
      <button class="btn-go" onclick="scrollToModule('charGrid')">继续学</button>
    </div>`;
  }

  const todayChars = (tLog.chars||[]).map(idx => (CHAR_DB[idx]||{}).char || '?').join('、');
  const learnedCount = (tLog.learned || []).length;
  const practicedCount = (tLog.practiced || []).length;

  if (learnedCount < (tLog.chars||[]).length) {
    html += `<div class="today-item today">
      <div class="today-item-text"><span class="tag-today">今日</span>学习 ${todayChars}（${learnedCount}/${tLog.chars.length}）</div>
      <button class="btn-go" onclick="scrollToModule('charGrid')">去学</button>
    </div>`;
  }
  if (learnedCount >= (tLog.chars||[]).length && practicedCount < (tLog.chars||[]).length) {
    html += `<div class="today-item today">
      <div class="today-item-text"><span class="tag-today">今日</span>趣味练习（${practicedCount}/${tLog.chars.length}）</div>
      <button class="btn-go" onclick="scrollToModule('practiceCard')">去练</button>
    </div>`;
  }
  if (!html) {
    html = `<div class="today-empty">🎉 太棒了！今天的任务都完成啦~</div>`;
  }
  list.innerHTML = html;
}
function scrollToModule(id) { document.getElementById(id).scrollIntoView({behavior:'smooth', block:'start'}); }

// ============================================================
function renderStageTabs() {
  const tabs = document.getElementById('stageTabs');
  const cur = getStage();
  let html = '';
  Object.keys(RAW_DB).sort((a,b)=>a-b).forEach(s => {
    const stageChars = getStageChars(s);

    html += `<div class="stage-tab ${Number(s)===cur?'active':''}" onclick="switchStage(${s})">

function switchStage(s) {
  if (Number(s) === getStage()) return;
  save(K.stage, Number(s));
  renderStageTabs();
  renderCharGrid();
  renderPractice();
  renderTodayBox();
}

// 全局已学集合
function isLearned(idx) {
  const log = getDailyLog();
  return Object.values(log).some(l => (l.learned||[]).includes(idx));
}

function renderCharGrid() {
  const grid = document.getElementById('charGrid');
  const tLog = getTodayLog();
  const todayChars = getTodayChars();
  const learnedSet = new Set(tLog.learned || []);

  let html = '';
  todayChars.forEach(c => {
    const learned = learnedSet.has(c.idx);
    html += `<div class="char-card ${learned ? 'learned' : ''}" onclick="openCharDetail(${c.idx})">
      <div class="learned-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="ch-emoji">${c.emoji}</div>
      <div class="ch-big">${c.char}</div>
      <div class="ch-pinyin">${c.pinyin}</div>
    </div>`;
  });
  grid.innerHTML = html;

  const learnedCount = learnedSet.size;
  const total = todayChars.length;
  document.getElementById('charBadge').textContent = `${learnedCount}/${total}`;
  document.getElementById('charProgress').innerHTML = learnedCount === total
    ? `<span class="done">全部学完啦！真棒！</span>`

// ============================================================
// 趣味练习：3 个小游戏
//   listen  → 听音选字：建立「音 → 形」对应，直击识字核心
//   picture → 看图选字：建立「义 → 形」对应，借 emoji 降低难度
//   memory  → 字卡翻翻乐：记忆 + 形义配对，纯游戏
// 前两个逐题记录进度（计入每日任务），翻翻乐为额外趣味不占进度
// ============================================================
const GAMES = [
  { key: 'listen',  icon: '🔊', name: '听音选字', scored: true  },
  { key: 'picture', icon: '🖼️', name: '看图选字', scored: true  },
  { key: 'memory',  icon: '🎴', name: '字卡翻翻乐', scored: false },
];
let currentGame = 'listen';
let practiceState = { answerIdx: -1, answered: false };

// 生成干扰项：从全库随机取，避开正确答案
function makeDistractors(answer, count) {
  const pool = CHAR_DB.filter(c => c.idx !== answer.idx);
  const picked = [];
  const used = new Set();
  while (picked.length < count && picked.length < pool.length) {
    const c = pool[Math.floor(Math.random() * pool.length)];
    if (used.has(c.idx)) continue;
    used.add(c.idx);
    picked.push(c);
  }
  return picked;
}

function renderPractice() {
  renderGameTabs();
  if (currentGame === 'memory') renderMemoryGame();
  else renderQuizGame(currentGame);
}

function renderGameTabs() {
  const tabs = document.getElementById('gameTabs');
  const tLog = getTodayLog();
  const done = new Set(tLog.practiced || []);
  const total = (tLog.chars || []).length;

  tabs.innerHTML = GAMES.map(g => {
    const label = g.scored ? `${done.size}/${total}` : '加分';
    return `<div class="game-tab ${g.key === currentGame ? 'active' : ''}" onclick="switchGame('${g.key}')">
      <span class="gt-icon">${g.icon}</span>
      <span>${g.name}</span>
      <span class="gt-done">${label}</span>
    </div>`;
  }).join('');
}

function switchGame(key) {
  currentGame = key;
  renderPractice();
}

// ---------- 听音选字 / 看图选字 ----------
function renderQuizGame(type) {
  const area = document.getElementById('practiceArea');
  const tLog = getTodayLog();
  const taskChars = (tLog.chars || []).map(i => CHAR_DB[i]).filter(Boolean);
  const done = new Set(tLog.practiced || []);

  // 今日任务已做完：cursor 可能已推进，不能再按新 cursor 出题
  const finished = !!tLog.done || done.size >= taskChars.length;
  if (finished || taskChars.length === 0) {
    area.innerHTML = `<div class="practice-done">
      <div class="title-done">今天的练习全完成啦！</div>
      <div class="sub-done">还想玩可以点上面的「字卡翻翻乐」哦~</div>
    </div>`;
    document.getElementById('practiceBadge').textContent =
      `${taskChars.length}/${taskChars.length}`;
    return;
  }

  // 答案限定在今日任务内未练习过的字
  const remaining = taskChars.filter(c => !done.has(c.idx));

  const answer = remaining[Math.floor(Math.random() * remaining.length)];
  const options = [answer, ...makeDistractors(answer, 3)].sort(() => Math.random() - 0.5);
  practiceState = { answerIdx: answer.idx, answered: false };

  let head = '';
  if (type === 'listen') {
    // 不显示答案字形，只能靠听
    head = `<button class="big-speak" id="bigSpeak" onclick="replayAudio()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <div class="replay-tip">点喇叭可以再听一次</div>`;
  } else {
    // 显示 emoji + 一个组词提示，不显示答案字形
    head = `<div class="pic-big">${answer.emoji}</div>
      <div class="pic-word">${answer.words[0] || ''}</div>`;
  }

  const hint = type === 'listen' ? '听一听，选出你听到的字' : '看一看，选出对应的字';

  area.innerHTML = `<div class="game-stage">
    ${head}
    <div class="game-hint">${hint}</div>
    <div class="opt-grid">
      ${options.map(o => `
        <div class="opt-card" data-idx="${o.idx}" onclick="pickOption(this,${o.idx})">
          <div class="oc-emoji">${type === 'listen' ? '' : o.emoji}</div>
          <div class="oc-char">${o.char}</div>
          <div class="oc-pinyin">${o.pinyin}</div>
        </div>`).join('')}
    </div>
    <div class="practice-feedback" id="practiceFeedback"></div>
    <button class="practice-next" id="practiceNext" onclick="renderPractice()">下一题</button>
  </div>`;

  document.getElementById('practiceBadge').textContent = `${done.size}/${taskChars.length}`;
  // 听音选字自动播放一次
  if (type === 'listen') setTimeout(replayAudio, 350);
}

function replayAudio() {
  const c = CHAR_DB[practiceState.answerIdx];
  if (!c) return;
  speak(c.char);
  const btn = document.getElementById('bigSpeak');
  if (btn) {
    btn.classList.add('pulsing');
    setTimeout(() => btn.classList.remove('pulsing'), 900);
  }
}

function pickOption(el, idx) {
  if (practiceState.answered) return;
  practiceState.answered = true;

  const isCorrect = idx === practiceState.answerIdx;
  const c = CHAR_DB[practiceState.answerIdx];
  const feedback = document.getElementById('practiceFeedback');
  const nextBtn = document.getElementById('practiceNext');
  const all = document.querySelectorAll('.opt-card');

  // 答对/答错都读一遍，强化音形绑定
  speak(CHAR_DB[idx].char);

  if (isCorrect) {
    el.classList.add('correct');
    feedback.className = 'practice-feedback success show';
    feedback.innerHTML = '答对啦！真棒！🎉';
  } else {
    el.classList.add('wrong');
    all.forEach(o => {
      if (Number(o.dataset.idx) === practiceState.answerIdx) o.classList.add('correct');
    });
    feedback.className = 'practice-feedback fail show';
    feedback.innerHTML = `不对哦，正确答案是「${c.char}」（${c.pinyin}）`;
    speak(c.char);
  }
  all.forEach(o => o.classList.add('disabled'));

  // 记录进度：答错也给过，避免卡住（次日还会再出现）
  const log = getDailyLog();
  const t = today();
  if (!log[t].practiced) log[t].practiced = [];
  if (!log[t].practiced.includes(c.idx)) {
    log[t].practiced.push(c.idx);
    save(K.dailyLog, log);
  }

  if (isCorrect) { addPoints(3, `练习答对：${c.char}`); renderPointsOverview(); }

  nextBtn.classList.add('show');
  renderGameTabs();
  renderTodayBox();
  checkDailyComplete();
}

// ---------- 字卡翻翻乐 ----------
let memState = { first: null, matched: 0, total: 0, lock: false };

function renderMemoryGame() {
  const area = document.getElementById('practiceArea');
  const todayChars = getTodayChars().slice(0, 6); // 最多 6 对，避免太长

  // 牌组：每个字一张「字」牌 + 一张「emoji」牌
  const deck = [];
  todayChars.forEach((c, i) => {
    deck.push({ pair: i, type: 'char',   text: c.char,   cls: 'is-char' });
    deck.push({ pair: i, type: 'emoji',  text: c.emoji,  cls: 'is-emoji' });
  });
  deck.sort(() => Math.random() - 0.5);

  memState = { first: null, matched: 0, total: todayChars.length, lock: false };

  area.innerHTML = `<div class="game-stage">
    <div class="memory-stat">找出 ${todayChars.length} 对字卡，全部配对成功有奖励哦！</div>
    <div class="memory-grid" id="memoryGrid">
      ${deck.map((d, i) => `
        <div class="mcard" data-i="${i}" data-pair="${d.pair}" onclick="flipCard2(this)">
          <div class="mface mback">?</div>
          <div class="mface mfront ${d.cls}">${d.text}</div>
        </div>`).join('')}
    </div>
    <div class="practice-feedback" id="practiceFeedback"></div>
  </div>`;

  document.getElementById('practiceBadge').textContent = `翻翻乐`;
}

function flipCard2(el) {
  if (memState.lock) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

  el.classList.add('flipped');
  const front = el.querySelector('.mfront');
  // 翻到字卡时读出来
  if (front && front.classList.contains('is-char')) speak(front.textContent);

  if (!memState.first) { memState.first = el; return; }

  const a = memState.first, b = el;
  if (a.dataset.pair === b.dataset.pair) {
    a.classList.add('matched'); b.classList.add('matched');
    memState.first = null;
    memState.matched++;
    if (memState.matched >= memState.total) {
      addPoints(5, '翻翻乐通关');
      renderPointsOverview();
      const fb = document.getElementById('practiceFeedback');
      fb.className = 'practice-feedback success show';
      fb.innerHTML = '全部配对成功！太厉害了！🎉 +5分';
      speak('全部配对成功，太厉害了');
    }
  } else {
    memState.lock = true;
    a.classList.add('shake'); b.classList.add('shake');
    setTimeout(() => {
      a.classList.remove('flipped', 'shake');
      b.classList.remove('flipped', 'shake');
      memState.first = null;
      memState.lock = false;
    }, 700);
  }
}

function checkDailyComplete() {
  const log = getDailyLog();
  const t = today();
  const tLog = log[t];
  if (!tLog) return;

  const allLearned = (tLog.learned || []).length >= (tLog.chars||[]).length;
  const allPracticed = (tLog.practiced || []).length >= (tLog.chars||[]).length;

  if (allLearned && allPracticed && !tLog.done) {
    tLog.done = true;
    save(K.dailyLog, log);
    addPoints(5, '每日全部完成奖励');

    const streak = getStreak();
    const y = yesterday();
    if (streak.lastDate === y) streak.count++;
    else if (streak.lastDate !== t) streak.count = 1;
    streak.lastDate = t;
    save(K.streak, streak);

    // 推进当前阶段的 cursor
    setStageCursor(getStageCursor() + getDailyCount());

    showCelebrate();
    renderPointsOverview();
    renderLevelMap();
    renderStageTabs();
  }
}

function renderLevelMap() {

    if (i < dates.length) cls = log[dates[i]].done ? 'done' : 'current';

function renderShop() {
  const grid = document.getElementById('shopGrid');
  const rewards = getRewards();
  const points = getPoints();
  const exchanges = getExchanges();

  if (rewards.length === 0) {
    grid.innerHTML = '<p style="color:var(--text-light);text-align:center;grid-column:1/-1;padding:16px 0;">商城还没有奖励，请家长在「家长管」中添加~</p>';
  } else {
    let html = '';
    rewards.forEach(r => {
      const pendingExchange = exchanges.find(e => e.rewardId === r.id && e.status === 'pending');
      const canAfford = points >= r.cost && !pendingExchange;
      const icon = REWARD_ICONS[r.icon] || REWARD_ICONS.default;
      html += `<div class="shop-item">
        ${pendingExchange ? '<div class="pending-badge">待确认</div>' : ''}
        <div class="shop-icon">${icon}</div>
        <div class="shop-name">${r.name}</div>
        <div class="shop-cost">${r.cost} <span class="coin">积分</span></div>
        <button class="btn-redeem" ${!canAfford ? 'disabled' : ''} onclick="redeemReward('${r.id}')">${pendingExchange ? '已兑换' : (points >= r.cost ? '兑换' : '积分不足')}</button>
      </div>`;
    });
    grid.innerHTML = html;
  }

  const exList = document.getElementById('exchangeList');
  const recentEx = exchanges.slice(-5).reverse();
  if (recentEx.length > 0) {
    let html = '<div style="font-size:0.95rem;font-weight:700;margin-bottom:8px;">兑换记录</div>';
    recentEx.forEach(e => {
      html += `<div class="exchange-item">
        <div><div class="ex-name">${e.name}</div><div class="ex-date">${e.date} · -${e.cost}积分</div></div>
        <div class="ex-status ${e.status}">${e.status === 'pending' ? '待确认' : '已兑现'}</div>
      </div>`;
    });
    exList.innerHTML = html;
  } else { exList.innerHTML = ''; }

  document.getElementById('shopBadge').textContent = rewards.length + '个奖励';
}

function redeemReward(rewardId) {
  const r = getRewards().find(rw => rw.id === rewardId);
  if (!r || getPoints() < r.cost) return;
  showModal('confirm', `确定用 ${r.cost} 积分兑换「${r.name}」吗？`, () => {
    addPoints(-r.cost, `兑换：${r.name}`);
    const exchanges = getExchanges();
    exchanges.push({ id: uid(), rewardId, name: r.name, cost: r.cost, date: today(), status: 'pending' });
    save(K.exchanges, exchanges);
    renderShop();
    renderPointsOverview();
    showModal('ok', `兑换成功！请找爸爸妈妈确认领取~`, null);
  });
}

  else if (/公园|玩|游/.test(name)) icon = 'park';

  else if (/贴/.test(name)) icon = 'sticker';

  const rewards = getRewards();

  document.getElementById('newRewardName').value = '';

// 数据导出导入
// ============================================================
function exportData() {
  const data = {};
  Object.values(K).forEach(key => {
    const v = localStorage.getItem(key);
    if (v) data[key] = JSON.parse(v);
  });
  // 阶段 cursor 是动态的，也要带上
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith(PREFIX + 'charCursor_s')) data[k] = JSON.parse(localStorage.getItem(k));
  });
  data._exportTime = new Date().toISOString();
  data._version = '2.0';

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `宝宝识字台_备份_${today()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      showModal('confirm', '确定导入备份吗？这将覆盖当前数据。', () => {
        Object.entries(data).forEach(([key, val]) => {
          if (key.startsWith(PREFIX)) localStorage.setItem(key, JSON.stringify(val));
        });
        showModal('ok', '导入成功！页面将刷新~', () => location.reload());
      });
    } catch(err) { showModal('ok', '导入失败，文件格式不对~', null); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showClearConfirm() {
  showModal('confirm-danger', '确定清空所有数据吗？所有学习记录和积分都将丢失！建议先导出备份。', () => {
    Object.values(K).forEach(key => localStorage.removeItem(key));
    Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k));
    showModal('ok', '已清空所有数据，页面将刷新~', () => location.reload());
  });
}

function showModal(type, message, callback) {
  const modal = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  if (type === 'confirm' || type === 'confirm-danger') {
    box.innerHTML = `<h3>${type === 'confirm-danger' ? '⚠️ 警告' : '确认'}</h3><p>${message}</p>
      <div class="modal-buttons">
        <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
        <button class="btn-modal-confirm" onclick="modalConfirm()">确定</button>
      </div>`;
  } else {
    box.innerHTML = `<h3>提示</h3><p>${message}</p>
      <div class="modal-buttons"><button class="btn-modal-ok" onclick="modalOk()">好的</button></div>`;
  }
  modal.classList.add('show');
  window._modalCallback = callback;
}
function modalConfirm() { closeModal(); if (window._modalCallback) window._modalCallback(); }
function modalOk() { closeModal(); if (window._modalCallback) window._modalCallback(); }

    inp.addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
      if (this.value && i < arr.length - 1) arr[i + 1].focus();
      if (i === arr.length - 1 && this.value) setTimeout(checkPin, 200);
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !this.value && i > 0) arr[i - 1].focus();
      if (e.key === 'Enter') checkPin();
    });
  });

  // 点击遮罩关闭字详情
  document.getElementById('detailOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('show');
      if (window.speechSynthesis) speechSynthesis.cancel();
    }
  });

  if (!localStorage.getItem(K.rewards)) {
    save(K.rewards, [
      { id: uid(), name: '小贴纸', cost: 10, icon: 'sticker' },
      { id: uid(), name: '看动画片30分钟', cost: 20, icon: 'tv' },
      { id: uid(), name: '吃冰淇淋', cost: 30, icon: 'ice' },
      { id: uid(), name: '去公园玩', cost: 50, icon: 'park' },
      { id: uid(), name: '买新玩具', cost: 100, icon: 'toy' },
    ]);
  }

  // 首次使用：从阶段 1 的前 5 个字开始，不留假数据
  if (!localStorage.getItem(K.dailyLog)) {
    save(K.stage, 1);
    save(K.charCursor + '_s1', 0);
    save(K.points, 0);
    save(K.streak, { count: 0, lastDate: '' });
    save(K.pointsHistory, []);
  }

  renderKidMode();
});
</script>

</body>
</html>
