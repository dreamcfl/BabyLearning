<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>宝宝识字台</title>
  <link rel="stylesheet" href="./css/common.css">
  <script src="./js/utils.js"></script>
  <script src="./js/chinese-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.3.0/dist/hanzi-writer.min.js"></script>
  <style>
    :root {
      --primary: #FF8C42;
      --primary-light: #FFB07A;
      --primary-dark: #E6731C;
      --secondary: #4ECDC4;
      --bg: #FFF9F5;
      --card: #FFFFFF;
      --text: #4A4A4A;
      --text-light: #888888;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== 顶部栏 ========== */
    .topbar {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 16px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(230, 115, 28, 0.3);
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topbar-title { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .topbar-title a { color: #fff; text-decoration: none; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
    .topbar-actions .points { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 50px; font-weight: 700; }

    /* ========== 模式标签 ========== */
    .mode-tabs { display: flex; background: rgba(255,255,255,0.25); border-radius: 50px; padding: 3px; margin-top: 12px; }
    .mode-tab {
      flex: 1; text-align: center; padding: 8px 0; font-size: 0.8rem; font-weight: 700;
      color: rgba(255,255,255,0.85); border-radius: 50px; cursor: pointer; transition: all 0.3s;
      border: none; background: transparent; min-height: 44px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      white-space: nowrap;
    }
    .mode-tab.active { background: #fff; color: #E6731C; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    /* ========== 主容器 ========== */
    .container { padding: 14px 16px; max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
      min-height: 420px;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title .badge {
      font-size: 0.75rem;
      background: var(--primary-light);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    .empty-tip {
      text-align: center;
      color: var(--text-light);
      padding: 40px 20px;
      font-size: 1rem;
    }

    /* ========== 阶段标签 ========== */
    .stage-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .stage-tabs::-webkit-scrollbar { display: none; }
    .stage-tab {
      flex: 0 0 auto;
      min-width: 90px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: #FFF5EE;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .stage-tab.active {
      background: #fff;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 140, 66, 0.15);
    }
    .stage-tab .st-name { font-weight: 700; font-size: 0.9rem; }
    .stage-tab .st-prog { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }

    /* ========== 字卡网格 ========== */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
    }
    .char-card {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFFFFF 100%);
      border: 2px solid #FFE8D6;
      border-radius: var(--radius);
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .char-card:active { transform: scale(0.96); }
    .char-card.learned { border-color: var(--secondary); background: #F0FFFD; }
    .char-card .learned-mark {
      position: absolute;
      top: 6px; right: 6px;
      width: 20px; height: 20px;
      background: var(--secondary);
      color: #fff;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .char-card.learned .learned-mark { display: flex; }
    .char-card .learned-mark svg { width: 12px; height: 12px; }
    .char-card .ch-emoji { font-size: 1.6rem; margin-bottom: 4px; }
    .char-card .ch-big { font-size: 2rem; font-weight: 800; color: var(--primary-dark); line-height: 1; }
    .char-card .ch-pinyin { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }

    /* ========== 今日任务提示 ========== */
    .today-banner {
      background: linear-gradient(90deg, #FFF5EE, #FFFFFF);
      border: 2px dashed var(--primary-light);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .today-banner.overdue { border-color: var(--red); background: #FFF0F0; }
    .today-banner .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .today-banner .tag-today { background: var(--primary); color: #fff; }
    .today-banner .tag-overdue { background: var(--red); color: #fff; }
    .today-banner .btn-go {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .today-empty {
      text-align: center;
      padding: 18px;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* ========== 练习区 ========== */
    .game-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .game-tabs::-webkit-scrollbar { display: none; }
    .game-tab {
      flex: 1;
      min-width: 90px;
      text-align: center;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      background: #FFF5EE;
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .game-tab.active {
      background: #fff;
      border-color: var(--primary);
      color: var(--primary);
    }
    .game-tab .gt-icon { display: block; font-size: 1.3rem; margin-bottom: 2px; }
    .game-tab .gt-done {
      display: block;
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 2px;
      font-weight: 500;
    }

    .game-stage { text-align: center; }
    .big-speak {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 6px 16px rgba(255, 140, 66, 0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .big-speak:active { transform: scale(0.95); }
    .big-speak.pulsing { animation: pulse 0.9s; }
    .big-speak svg { width: 48px; height: 48px; }
    .replay-tip {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .pic-big { font-size: 4rem; margin-bottom: 6px; }
    .pic-word { font-size: 1.1rem; color: var(--text-light); margin-bottom: 14px; }
    .game-hint { font-size: 1rem; color: var(--text); font-weight: 700; margin-bottom: 16px; }
    .opt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .opt-card {
      background: #FFF8F0;
      border: 2px solid #FFE8D6;
      border-radius: var(--radius);
      padding: 14px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-card:active { transform: scale(0.96); }
    .opt-card .oc-emoji { font-size: 1.6rem; margin-bottom: 4px; }
    .opt-card .oc-char { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); }
    .opt-card .oc-pinyin { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }
    .opt-card.correct { background: #E8FFF5; border-color: var(--green); }
    .opt-card.wrong { background: #FFF0F0; border-color: var(--red); }
    .opt-card.disabled { opacity: 0.7; pointer-events: none; }
    .practice-feedback {
      min-height: 28px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .practice-feedback.show { opacity: 1; }
    .practice-feedback.success { color: var(--green); }
    .practice-feedback.fail { color: var(--red); }
    .practice-next {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    .practice-next.show { display: inline-block; }
    .practice-done { text-align: center; padding: 30px 20px; }
    .practice-done .title-done { font-size: 1.3rem; font-weight: 800; color: var(--green); margin-bottom: 8px; }
    .practice-done .sub-done { color: var(--text-light); }

    /* ========== 翻翻乐 ========== */
    .memory-stat { font-size: 0.95rem; color: var(--text-light); margin-bottom: 12px; }
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 420px;
      margin: 0 auto 16px;
    }
    .mcard {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.35s;
    }
    .mcard.flipped { transform: rotateY(180deg); }
    .mcard.matched { background: var(--green); }
    .mcard.shake { animation: shake 0.4s; }
    .mface {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }
    .mfront { background: #FFF8F0; color: var(--primary-dark); border: 2px solid #FFE8D6; transform: rotateY(180deg); }
    .mfront.is-emoji { font-size: 2rem; }
    .mfront.is-char { font-size: 2.2rem; }
    .mback { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); }

    /* ========== 闯关地图 ========== */
    .level-back-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.25);
      transition: transform 0.15s, box-shadow 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .level-back-btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(255, 140, 66, 0.2); }
    .level-back-btn::before { content: "←"; font-size: 1rem; }
    .level-map {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 10px 0;
    }
    .level-dot {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      background: #E8E8E8;
      color: #999;
    }
    .level-dot.done { background: var(--green); color: #fff; }
    .level-dot.current { background: var(--primary); color: #fff; box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2); }

    /* ========== 字卡墙 ========== */
    .wall-tip {
      background: #fff;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      color: var(--text-light);
      font-size: 0.85rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .wall-section { margin-bottom: 20px; }
    .wall-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .wall-section-title span {
      font-size: 0.75rem;
      background: #FFF3E0;
      color: var(--primary-dark);
      padding: 2px 10px;
      border-radius: 50px;
    }

    /* ========== 字详情弹窗 ========== */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }
    .detail-overlay.show { display: flex; }
    .detail-box {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: modalIn 0.3s;
    }
    .detail-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .detail-head .d-emoji { font-size: 3rem; }
    .detail-head .d-text { flex: 1; }
    .detail-head .d-pinyin { font-size: 1.1rem; color: var(--text-light); }
    .detail-head .d-meaning { font-size: 1.3rem; font-weight: 800; }
    .speak-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-speak {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-speak svg { width: 26px; height: 26px; }
    .btn-speak.speaking { animation: pulse 0.9s infinite; }
    .speak-tip {
      position: absolute;
      top: 56px;
      font-size: 0.65rem;
      color: var(--primary);
      white-space: nowrap;
      font-weight: 700;
    }
    .stroke-wrap {
      background: #FFF8F0;
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }
    #strokeBox {
      width: 240px; height: 240px;
      margin: 0 auto 12px;
      background: #fff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FFE8D6;
    }
    .stroke-fallback {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stroke-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-stroke {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-stroke.ghost { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    .detail-section-title {
      font-weight: 800;
      margin: 16px 0 10px;
      color: var(--text);
    }
    .word-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .word-chip {
      background: #FFF8F0;
      border: 1px solid #FFE8D6;
      border-radius: 18px;
      padding: 8px 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .word-chip svg { width: 16px; height: 16px; color: var(--primary); }
    .picto-box {
      background: #FFF8F0;
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .picto-box svg { width: 100px; height: 100px; margin-bottom: 8px; }
    .picto-box span { display: block; color: var(--text-light); font-size: 0.85rem; }
    .detail-close {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--green) 0%, #3AAFA6 100%);
      color: #fff;
      padding: 16px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 24px;
      cursor: pointer;
      min-height: 56px;
      box-shadow: 0 6px 16px rgba(107, 203, 119, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .detail-close:active { transform: scale(0.97); box-shadow: 0 3px 10px rgba(107, 203, 119, 0.3); }
    .detail-close::before { content: "✨"; font-size: 1.2rem; }

    /* ========== 通用弹窗（覆盖 common.css 补充样式） ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 28px 22px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: modalIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    .modal-box h3 {
      font-size: 1.35rem;
      color: var(--text);
      margin-bottom: 10px;
      font-weight: 800;
    }
    .modal-box p {
      color: var(--text-light);
      margin-bottom: 22px;
      font-size: 1rem;
      line-height: 1.55;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .modal-btn {
      flex: 1;
      min-width: 110px;
      border: none;
      background: var(--green);
      color: #fff;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 52px;
      box-shadow: 0 4px 12px rgba(107, 203, 119, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .modal-btn:active { transform: scale(0.96); }
    .modal-btn.primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.35);
    }
    .modal-btn.secondary { background: #F0F0F0; color: var(--text); box-shadow: none; }

    /* ========== 庆祝弹窗内容 ========== */
    .celebrate-box { text-align: center; padding: 10px; }
    .celebrate-box .stars { font-size: 3rem; margin-bottom: 8px; }
    .celebrate-box h3 { font-size: 1.25rem; margin-bottom: 8px; }
    .points-gain { color: var(--primary); font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; }

    /* ========== 离线提示 ========== */
    .offline-tip {
      display: none;
      background: #FFF8E1;
      color: #B28600;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 14px;
      text-align: center;
    }
    .offline-tip.show { display: block; }

    @media (max-width: 480px) {
      html { font-size: 16px; }
      .char-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <div class="topbar-title">
        <a href="./index.html">←</a>
        <span>📖 宝宝识字台</span>
      </div>
      <div class="topbar-actions">
        <span class="points">💎 <span data-points>0</span></span>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-today" onclick="switchMode('today')">📚 今日识字</button>
      <button class="mode-tab" id="tab-practice" onclick="switchMode('practice')">🎮 趣味练习</button>
      <button class="mode-tab" id="tab-map" onclick="switchMode('map')">🗺️ 闯关地图</button>
      <button class="mode-tab" id="tab-wall" onclick="switchMode('wall')">🃏 字卡墙</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div id="gameArea"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box" id="detailBox"></div>
  </div>

<script>
// 字库数据已迁移到 js/chinese-data.js
// ============================================================
// 兼容存储层（直接复用 utils.js 中的 ChineseStore）
// ============================================================
function today() { return ChineseStore.today(); }
function yesterday() { return ChineseStore.yesterday(); }
function uid() { return ChineseStore.uid(); }
function load(key, def) { return ChineseStore.load(key, def); }
function save(key, val) { ChineseStore.save(key, val); }
function getDailyCount() { return ChineseStore.getDailyCount(); }
function getCharCursor() { return ChineseStore.getCharCursor(); }
function getDailyLog() { return ChineseStore.getDailyLog(); }
function getPoints() { return ChineseStore.getPoints(); }
function getPointsHistory() { return ChineseStore.getPointsHistory(); }
function getStreak() { return ChineseStore.getStreak(); }
function getStage() { return ChineseStore.getStage(); }
function getStageCursor() { return ChineseStore.getStageCursor(getStage()); }
function setStageCursor(v) { ChineseStore.setStageCursor(getStage(), v); }

// ============================================================
// 语音
// ============================================================
function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = speechRate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

function speakEnglish(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = speechRate;
  window.speechSynthesis.speak(u);
}

// ============================================================
// 笔顺
// ============================================================
let currentWriter = null;

function renderStroke(charId, char) {
  const box = document.getElementById('strokeBox');
  if (!box) return;
  currentWriter = null;
  box.style.display = 'flex';
  box.style.alignItems = 'center';
  box.style.justifyContent = 'center';
  box.style.gap = '0';
  box.innerHTML = '<div class="stroke-fallback">' + char + '</div>';
  if (window.HanziWriter) {
    try {
      box.innerHTML = '';
      currentWriter = HanziWriter.create(box, char, {
        width: 240, height: 240, padding: 5,
        strokeColor: '#FF8C42', radicalColor: '#4ECDC4',
        strokeAnimationSpeed: 1, delayBetweenStrokes: 300,
        showCharacter: false, showOutline: true
      });
      currentWriter.animateCharacter();
    } catch (e) { box.innerHTML = '<div class="stroke-fallback">' + char + '</div>'; }
  }
}

function animateStroke() {
  if (currentWriter && currentWriter.animateCharacter) {
    currentWriter.animateCharacter();
  }
}

function startQuiz() {
  if (currentWriter && currentWriter.quiz) {
    currentWriter.quiz();
  } else {
    showModal('提示', '笔顺数据还没准备好，请稍后再试~', [{ text: '确定', action: closeModal }]);
  }
}

// ============================================================
// 通用辅助
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getStageChars(stage) {
  const s = STAGES[stage - 1];
  if (!s) return [];
  return CHAR_DB.slice(s.idx, s.idx + s.count);
}

function getTodayChars() {
  const daily = getDailyCount();
  const log = getDailyLog();
  const learnedToday = log[today()] || [];

  // 如果已经完成今日任务，直接显示已学字
  if (learnedToday.length >= daily) {
    return learnedToday.slice(0, daily).map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean);
  }

  // 优先显示今天已学的字，确保能继续看到学习进度和对号
  let pool = learnedToday.map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean);

  // 从当前阶段取未学过的补充到每日目标
  const current = getStage();
  const stageChars = getStageChars(current);
  const progress = load(ChineseStore.progress, {});
  const unlearnedStage = stageChars.filter(c => !progress[c.id]);
  const extraPool = unlearnedStage.length ? unlearnedStage : stageChars;
  for (const c of extraPool) {
    if (pool.length >= daily) break;
    if (!pool.find(x => x.id === c.id)) pool.push(c);
  }

  // 如果还不够，从下一阶段补
  if (pool.length < daily) {
    const next = getStageChars(current + 1);
    for (const c of next) {
      if (pool.length >= daily) break;
      if (!pool.find(x => x.id === c.id)) pool.push(c);
    }
  }

  // 仍不够则全库随机
  if (pool.length < daily) {
    const all = shuffle(CHAR_DB);
    for (const c of all) {
      if (pool.length >= daily) break;
      if (!pool.find(x => x.id === c.id)) pool.push(c);
    }
  }

  return pool;
}

function recordLearn(charId) {
  const log = getDailyLog();
  const day = today();
  if (!log[day]) log[day] = [];
  if (!log[day].includes(charId)) log[day].push(charId);
  save(ChineseStore.dailyLog, log);
  const progress = load(ChineseStore.progress, {});
  if (!progress[charId]) {
    progress[charId] = { first: today(), count: 0 };
  }
  progress[charId].count++;
  progress[charId].last = today();
  save(ChineseStore.progress, progress);
  checkStreak();
}

function checkStreak() {
  const s = getStreak();
  const yd = yesterday();
  if (s.lastDate === today()) return;
  if (s.lastDate === yd || s.lastDate === '') {
    s.count = (s.lastDate === yd) ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.lastDate = today();
  ChineseStore.saveStreak(s);
}

function checkDailyComplete() {
  const log = getDailyLog();
  const learnedToday = log[today()] || [];
  return learnedToday.length >= getDailyCount();
}

// ============================================================
// 模式切换与渲染入口
// ============================================================
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('tab-' + mode);
  if (tab) tab.classList.add('active');
  renderGame();
}

function updateHeader() {
  document.querySelectorAll('[data-points]').forEach(el => {
    el.textContent = ChineseStore.getPoints();
  });
}

function renderGame() {
  updateHeader();
  const area = document.getElementById('gameArea');
  if (!area) return;
  if (currentMode === 'today') renderToday(area);
  else if (currentMode === 'practice') renderPractice(area);
  else if (currentMode === 'map') {
    // 修复：闯关地图进入关卡后，保持在关卡详情界面，不要回到大地图
    if (levelView) renderLevel(area);
    else renderLevelMap(area);
  }
  else if (currentMode === 'wall') renderWall(area);
}

// ============================================================
// 今日识字
// ============================================================
function renderToday(area) {
  const chars = getTodayChars();
  const log = getDailyLog();
  const learnedToday = (log[today()] || []).slice();
  const daily = getDailyCount();
  const complete = checkDailyComplete();

  let html = '<div class="section-title">今日识字<span class="badge">' + learnedToday.length + '/' + daily + '</span></div>';

  if (complete) {
    html += '<div class="today-empty">🎉 今天任务完成啦！去“趣味练习”玩玩吧～</div>';
  } else {
    html += '<div class="today-banner"><div><span class="tag tag-today">今日目标</span>每天认识 ' + daily + ' 个新汉字</div></div>';
  }

  html += '<div class="char-grid">';
  chars.forEach(c => {
    const learned = learnedToday.includes(c.id);
    html += '<div class="char-card ' + (learned ? 'learned' : '') + '" onclick="openCharDetail(\'' + c.id + '\')">' +
      '<div class="learned-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6 10-14"/></svg></div>' +
      '<div class="ch-emoji">' + c.emoji + '</div>' +
      '<div class="ch-big">' + c.char + '</div>' +
      '<div class="ch-pinyin">' + c.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

// ============================================================
// 趣味练习
// ============================================================
function renderPractice(area) {
  const tabs = [
    { key: 'listen', icon: '👂', label: '听音选字' },
    { key: 'pinyin', icon: '🔤', label: '看字选拼音' },
    { key: 'meaning', icon: '🎨', label: '看图选字' },
    { key: 'memory', icon: '🧠', label: '汉字翻翻乐' }
  ];
  let html = '<div class="section-title">趣味练习<span class="badge">快乐巩固</span></div>';
  html += '<div class="game-tabs">';
  tabs.forEach(t => {
    html += '<div class="game-tab ' + (currentPracticeTab === t.key ? 'active' : '') + '" onclick="switchPractice(\'' + t.key + '\')">' +
      '<span class="gt-icon">' + t.icon + '</span>' + t.label + '</div>';
  });
  html += '</div><div id="practiceBox">';

  if (currentPracticeTab === 'memory') {
    html += renderMemoryGameHTML();
  } else {
    html += renderQuizGameHTML(currentPracticeTab);
  }
  html += '</div>';
  area.innerHTML = html;
}

function switchPractice(key) {
  currentPracticeTab = key;
  practiceState = {};
  memoryState = { first: null, matches: 0, total: 0, locked: false, pairs: [] };
  renderGame();
}

function renderQuizGameHTML(type) {
  const learned = Object.keys(load(ChineseStore.progress, {}));
  const pool = learned.length >= 4 ? learned.map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean) : shuffle(CHAR_DB).slice(0, 20);
  if (pool.length < 4) return '<div class="empty-tip">先去“今日识字”学几个字再来挑战吧～</div>';

  const current = pool[Math.floor(Math.random() * pool.length)];
  const question = (function() {
    if (type === 'listen') return { text: '请听读音，选择正确的汉字', speakText: current.char, emoji: '🔊' };
    if (type === 'pinyin') return { text: '这个字的拼音是什么？', speakText: current.char, emoji: current.char };
    if (type === 'meaning') return { text: '哪个字是 ' + current.meaning + ' 的意思？', speakText: '', emoji: current.emoji };
    return { text: '请选择', speakText: '', emoji: '' };
  })();

  const distractors = shuffle(pool.filter(c => c.id !== current.id)).slice(0, 3);
  const options = shuffle([current].concat(distractors));
  practiceState.current = current;
  practiceState.answered = false;

  let html = '<div class="game-stage">';
  html += '<div class="pic-big">' + question.emoji + '</div>';
  if (type === 'listen') {
    html += '<button class="big-speak" onclick="speak(\'' + current.char + '\');this.classList.add(\'pulsing\');setTimeout(()=>this.classList.remove(\'pulsing\'),900)">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>';
    html += '<div class="replay-tip">点喇叭听一听</div>';
  } else if (type === 'pinyin') {
    html += '<div class="pic-word" style="font-size:3rem;font-weight:800;color:var(--primary-dark)">' + current.char + '</div>';
  } else {
    html += '<div class="pic-word">' + current.meaning + '</div>';
  }
  html += '<div class="game-hint">' + question.text + '</div>';
  html += '<div class="opt-grid">';
  options.forEach(opt => {
    html += '<div class="opt-card" id="opt_' + opt.id + '" onclick="pickOption(\'' + opt.id + '\',\'' + current.id + '\',\'' + type + '\')">' +
      '<div class="oc-emoji">' + opt.emoji + '</div>' +
      '<div class="oc-char">' + opt.char + '</div>' +
      '<div class="oc-pinyin">' + opt.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  html += '<div class="practice-feedback" id="practiceFeedback"></div>';
  html += '<button class="practice-next" id="practiceNext" onclick="renderGame()">下一题 →</button>';
  html += '</div>';
  return html;
}

function pickOption(selectedId, correctId, type) {
  if (practiceState.answered) return;
  practiceState.answered = true;
  const correct = selectedId === correctId;
  const current = CHAR_DB.find(c => c.id === correctId);
  const fb = document.getElementById('practiceFeedback');
  const next = document.getElementById('practiceNext');

  document.querySelectorAll('.opt-card').forEach(el => el.classList.add('disabled'));
  const sel = document.getElementById('opt_' + selectedId);
  const cor = document.getElementById('opt_' + correctId);
  if (correct) {
    sel.classList.add('correct');
    fb.textContent = '✅ 答对啦！+' + (type === 'listen' ? 5 : 3) + ' 积分';
    fb.className = 'practice-feedback show success';
    ChineseStore.addPoints(type === 'listen' ? 5 : 3, '趣味练习答对');
    speak('真棒！' + current.char);
  } else {
    sel.classList.add('wrong');
    cor.classList.add('correct');
    fb.textContent = '❌ 不对哦，正确答案是 ' + current.char;
    fb.className = 'practice-feedback show fail';
    speak(current.char);
  }
  if (next) next.classList.add('show');
  updateHeader();
}

function renderMemoryGameHTML() {
  const learned = Object.keys(load(ChineseStore.progress, {}));
  let pool = learned.map(id => CHAR_DB.find(c => c.id === id)).filter(Boolean);
  if (pool.length < 5) pool = shuffle(CHAR_DB).slice(0, 5);
  pool = shuffle(pool).slice(0, 5);
  const pairs = shuffle(pool.flatMap(c => [
    { id: c.id, type: 'char', val: c.char, meta: c },
    { id: c.id, type: 'emoji', val: c.emoji, meta: c }
  ]));
  memoryState.pairs = pairs;
  memoryState.first = null;
  memoryState.matches = 0;
  memoryState.total = pairs.length / 2;
  memoryState.locked = false;

  let html = '<div class="memory-stat">配对 <span id="memMatches">0</span>/' + memoryState.total + '</div>';
  html += '<div class="memory-grid">';
  pairs.forEach((p, i) => {
    html += '<div class="mcard" id="mcard_' + i + '" data-idx="' + i + '" onclick="flipCard(' + i + ')">' +
      '<div class="mface mfront ' + (p.type === 'emoji' ? 'is-emoji' : 'is-char') + '">' + p.val + '</div>' +
      '<div class="mface mback">?</div></div>';
  });
  html += '</div>';
  html += '<div class="practice-feedback" id="memFeedback"></div>';
  return html;
}

function flipCard(idx) {
  if (memoryState.locked) return;
  const el = document.getElementById('mcard_' + idx);
  if (!el || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  const p = memoryState.pairs[idx];
  speak(p.meta.char);

  if (memoryState.first === null) {
    memoryState.first = idx;
    return;
  }

  const firstIdx = memoryState.first;
  const first = memoryState.pairs[firstIdx];
  if (first.id === p.id && firstIdx !== idx) {
    memoryState.locked = true;
    setTimeout(() => {
      document.getElementById('mcard_' + firstIdx).classList.add('matched');
      el.classList.add('matched');
      memoryState.matches++;
      document.getElementById('memMatches').textContent = memoryState.matches;
      memoryState.first = null;
      memoryState.locked = false;
      if (memoryState.matches >= memoryState.total) {
        const fb = document.getElementById('memFeedback');
        fb.textContent = '🎉 全部配对成功！+10 积分';
        fb.className = 'practice-feedback show success';
        ChineseStore.addPoints(10, '翻翻乐完成');
        updateHeader();
      }
    }, 400);
  } else {
    memoryState.locked = true;
    const firstEl = document.getElementById('mcard_' + firstIdx);
    setTimeout(() => {
      el.classList.add('shake');
      firstEl.classList.add('shake');
      setTimeout(() => {
        el.classList.remove('flipped', 'shake');
        firstEl.classList.remove('flipped', 'shake');
        memoryState.first = null;
        memoryState.locked = false;
      }, 400);
    }, 600);
  }
}

// ============================================================
// 闯关地图
// ============================================================
function renderLevelMap(area) {
  const progress = load(ChineseStore.progress, {});
  const totalChars = CHAR_DB.length;
  const levelSize = 5;
  const totalLevels = Math.ceil(totalChars / levelSize);
  const completed = Object.keys(progress).length;
  let currentLevel = Math.floor(completed / levelSize) + 1;
  if (currentLevel > totalLevels) currentLevel = totalLevels;

  let html = '<div class="section-title">闯关地图<span class="badge">已学 ' + completed + '/' + totalChars + '</span></div>';
  html += '<div class="level-map">';
  for (let i = 1; i <= totalLevels; i++) {
    const done = i < currentLevel;
    const cur = i === currentLevel;
    html += '<div class="level-dot ' + (done ? 'done' : '') + ' ' + (cur ? 'current' : '') + '" ' +
      'onclick="startLevel(' + i + ')" title="第 ' + i + ' 关">' + (done ? '✓' : i) + '</div>';
  }
  html += '</div>';
  html += '<div class="empty-tip">点击关卡开始挑战，每关 5 个汉字</div>';
  area.innerHTML = html;
}

let levelView = null;

function startLevel(level) {
  const levelSize = 5;
  const start = (level - 1) * levelSize;
  const chars = CHAR_DB.slice(start, start + levelSize);
  if (!chars.length) return;
  currentStage = level;
  save(ChineseStore.stage, level);
  levelView = { level, chars };
  renderGame();
}

function renderLevel(area) {
  if (!levelView) return renderLevelMap(area);
  const level = levelView.level;
  const chars = levelView.chars;
  const learnedIds = Object.keys(load(ChineseStore.progress, {}));
  let html = '<div class="section-title"><span>第 ' + level + ' 关</span><button class="level-back-btn" onclick="levelView=null;renderGame()">返回地图</button></div>';
  html += '<div class="char-grid">';
  chars.forEach(c => {
    const learned = learnedIds.includes(c.id);
    html += '<div class="char-card ' + (learned ? 'learned' : '') + '" onclick="openCharDetail(\'' + c.id + '\')">' +
      '<div class="learned-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6 10-14"/></svg></div>' +
      '<div class="ch-emoji">' + c.emoji + '</div>' +
      '<div class="ch-big">' + c.char + '</div>' +
      '<div class="ch-pinyin">' + c.pinyin + '</div>' +
      '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

// ============================================================
// 字卡墙
// ============================================================
function renderWall(area) {
  const learnedIds = Object.keys(load(ChineseStore.progress, {}));
  const byTag = {};
  CHAR_DB.forEach(c => {
    byTag[c.tag] = byTag[c.tag] || [];
    byTag[c.tag].push(c);
  });
  const tags = Object.keys(byTag);

  let html = '<div class="section-title">字卡墙<span class="badge">已学 ' + learnedIds.length + ' / ' + CHAR_DB.length + '</span></div>';
  html += '<div class="wall-tip">点一点字卡，复习学过的字，预习还没学的字～</div>';

  tags.forEach(tag => {
    const list = byTag[tag];
    const learnedCount = list.filter(c => learnedIds.includes(c.id)).length;
    html += '<div class="wall-section">';
    html += '<div class="wall-section-title">' + tag + '<span>' + learnedCount + '/' + list.length + '</span></div>';
    html += '<div class="char-grid">';
    list.forEach(c => {
      const learned = learnedIds.includes(c.id);
      html += '<div class="char-card ' + (learned ? 'learned' : '') + '" onclick="openCharDetail(\'' + c.id + '\')">' +
        '<div class="learned-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6 10-14"/></svg></div>' +
        '<div class="ch-emoji">' + c.emoji + '</div>' +
        '<div class="ch-big">' + c.char + '</div>' +
        '<div class="ch-pinyin">' + c.pinyin + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });
  area.innerHTML = html;
}

// ============================================================
// 字详情弹窗
// ============================================================
let detailCharId = null;

function openCharDetail(charId) {
  const c = CHAR_DB.find(x => x.id === charId);
  if (!c) return;
  detailCharId = charId;

  const box = document.getElementById('detailBox');
  let html = '<div class="detail-head">' +
    '<div class="d-emoji">' + c.emoji + '</div>' +
    '<div class="d-text"><div class="d-pinyin">' + c.pinyin + '</div><div class="d-meaning">' + c.char + ' · ' + c.meaning + '</div></div>' +
    '<div class="speak-wrap"><button class="btn-speak" id="detailSpeak" onclick="speak(\'' + c.char + '\');document.getElementById(\'detailSpeak\').classList.add(\'speaking\');setTimeout(()=>document.getElementById(\'detailSpeak\').classList.remove(\'speaking\'),900)">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>' +
    '<span class="speak-tip">点我读一读</span></div></div>';

  html += '<div class="stroke-wrap"><div class="detail-section-title">笔画笔顺</div><div id="strokeBox"></div>' +
    '<div class="stroke-actions"><button class="btn-stroke" onclick="renderStroke(\'' + c.id + '\',\'' + c.char + '\')">再写一遍</button>' +
    '<button class="btn-stroke ghost" onclick="startQuiz()">跟写</button></div></div>';

  html += '<div class="detail-section-title">例词</div><div class="word-chips">' +
    '<div class="word-chip" onclick="speak(\'' + c.word + '\')">' + c.word + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></div>' +
    '</div>';

  html += '<button class="detail-close" id="btnLearned" onclick="markLearned()">学会了</button>';
  box.innerHTML = html;
  document.getElementById('detailOverlay').classList.add('show');
  setTimeout(() => renderStroke(c.id, c.char), 100);
  speak(c.char);
}

function closeDetail() {
  // 仅关闭详情弹窗（如点击遮罩），不记录学习进度
  detailCharId = null;
  document.getElementById('detailOverlay').classList.remove('show');
}

function markLearned() {
  // 用户点击“学会了”才记录学习，并给出积分提示
  const charId = detailCharId;
  if (!charId) return;
  detailCharId = null;
  document.getElementById('detailOverlay').classList.remove('show');

  const progress = load(ChineseStore.progress, {});
  const isNew = !progress[charId];
  recordLearn(charId);
  if (isNew) {
    ChineseStore.addPoints(2, '识字：' + (CHAR_DB.find(c => c.id === charId) || {}).char);
    showModal('🎉 真棒！', '你学会了一个新字，获得 2 积分！', [{ text: '继续', action: closeModal }]);
  } else {
    showModal('👍 已学会', '这个字你已经学会啦，再去看看别的字吧～', [{ text: '继续', action: closeModal }]);
  }
  // 积分弹窗打开时同步刷新底层界面，确保关闭后已学状态已更新
  renderGame();
}

// ============================================================
// 弹窗
// ============================================================
function showModal(title, content, buttons) {
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  buttons = buttons || [{ text: '确定', action: closeModal }];
  let html = '<h3>' + title + '</h3><p>' + content + '</p><div class="modal-actions">';
  buttons.forEach((b, i) => {
    html += '<button class="modal-btn ' + (i === 0 ? 'primary' : '') + '" onclick="modalAction(' + i + ')">' + b.text + '</button>';
  });
  html += '</div>';
  box.innerHTML = html;
  box.dataset.actions = JSON.stringify(buttons.map(b => b.action ? b.action.toString() : ''));
  overlay.classList.add('show');
}

function modalAction(i) {
  closeModal();
  // 简单支持：如果按钮有 action 字符串，重新触发 renderGame
  renderGame();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ============================================================
// 初始化
// ============================================================
function init() {
  voiceOn = ChineseStore.getVoiceEnabled();
  speechRate = ChineseStore.getRate() || 0.7;
  currentStage = getStage();
  updateHeader();
  renderGame();

  // 详情弹窗点击遮罩关闭
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target.id === 'detailOverlay') closeDetail();
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
}

window.addEventListener('load', init);

</script>
</body>
